# =============================================================================
# Track E2: Staging Deployment Pipeline
#
# Triggers on push to main. Runs backend tests as gatekeeper.
# Tests always run; image publication requires explicit manual opt-in.
# =============================================================================
name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly opt in to image publication and staging handoff
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ---------------------------------------------------------------------------
  # Gate: Backend Tests (must pass before any deployment)
  # ---------------------------------------------------------------------------
  test:
    name: Backend Tests (Gatekeeper)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # Maintenance database only: no POSTGRES_DB is set, so the service
        # never pre-creates an admin-owned application database. The product
        # provisioner creates the target test database (CTO contract R2).
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Provision test database via the five-phase product recipe
        id: provision
        env:
          CI_PG_HOST: localhost
          CI_PG_PORT: "5432"
          CI_PG_ADMIN_USER: postgres
          CI_PG_ADMIN_PASSWORD: postgres
          CI_TEST_DB: ci_mpango_test
          CI_TEST_TENANT_SCHEMA: t_test
          CI_REDIS_URL: redis://localhost:6379/0
        run: |
          bash tools/ci/bootstrap_backend_test_db.sh --github-env "$GITHUB_ENV" --profile-dir "$RUNNER_TEMP" --plan-file "$RUNNER_TEMP/supply-plan.json"

      - name: Prepare short-lived synthetic signing key
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          # Hex cannot contain the validator's non-hex weak words.
          while True:
              key = secrets.token_hex(32)
              if not any(weak in key for weak in ("123456", "abc123")):
                  break
          print("::add-mask::" + key, flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("SECRET_KEY=" + key + "\\n")
          PY

      - name: Run backend tests (runtime profile)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        run: |
          timeout --signal=INT --kill-after=60s 20m poetry run pytest $(tr '\n' ' ' < "$RUNNER_TEMP/profile-runtime.tests") -q --tb=short --junitxml=../junit-runtime.xml

      - name: Run backend tests (migration-topology profile)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        env:
          MPANGO_ALLOW_TEMP_DB_CREATE: "1"
        run: |
          timeout --signal=INT --kill-after=60s 20m poetry run pytest $(tr '\n' ' ' < "$RUNNER_TEMP/profile-migration-topology.tests") -q --tb=short --junitxml=../junit-migration-topology.xml

      - name: Upload test evidence (junit + supply plan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          if-no-files-found: ignore
          path: |
            junit-runtime.xml
            junit-migration-topology.xml
            ${{ runner.temp }}/supply-plan.json

  # ---------------------------------------------------------------------------
  # Build: Docker image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Integrity Gate (Verify Scripts Exist)
        run: |
          IMAGE="${{ steps.meta.outputs.tags }}"
          echo "Verifying critical files in $IMAGE..."

          # Verify seed_demo_data.py exists (required for staging data seeding)
          echo "Checking /app/scripts/seed_demo_data.py..."
          docker run --rm $IMAGE ls -la /app/scripts/seed_demo_data.py

          # Verify create_wholesaler.py exists (required for tenant creation)
          echo "Checking /app/scripts/create_wholesaler.py..."
          docker run --rm $IMAGE ls -la /app/scripts/create_wholesaler.py

          # Verify onboard_tenant.py exists (required for tenant onboarding)
          echo "Checking /app/scripts/onboard_tenant.py..."
          docker run --rm $IMAGE ls -la /app/scripts/onboard_tenant.py

          echo "✅ Build integrity gate passed - all critical scripts verified"

  # ---------------------------------------------------------------------------
  # Deploy: (mock) — outputs instructions for manual staging deploy
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Staging
    needs: [test, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Staging deployment summary
        run: |
          echo "============================================="
          echo "  Mpango ERP — Staging Deployment Ready"
          echo "============================================="
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "To deploy manually:"
          echo "  1. SSH into staging server"
          echo "  2. docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "  3. docker compose -f docker-compose.prod.yml up -d"
          echo "  4. bash scripts/reset-staging.sh  # (first time only)"
          echo ""
          echo "Or use the production-like local run:"
          echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build"
          echo ""
