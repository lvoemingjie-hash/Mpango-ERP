[project]
name = "mpango-erp-backend"
version = "0.1.0"
description = "Multi-tenant ERP system for African wholesale-retail operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Mpango Team"}
]
keywords = ["erp", "fastapi", "multi-tenant", "wholesale", "retail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[tool.poetry]
name = "mpango-erp-backend"
version = "0.1.0"
description = "Multi-tenant ERP system for African wholesale-retail operations"
readme = "README.md"
authors = ["Mpango Team"]
license = "Proprietary"

[tool.poetry.dependencies]
python = ">=3.11"

# FastAPI and ASGI
fastapi = ">=0.104.0,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.24.0,<1.0.0"}

# Database
sqlalchemy = ">=2.0.0,<3.0.0"
asyncpg = ">=0.29.0,<1.0.0"
alembic = ">=1.12.0,<2.0.0"
psycopg2-binary = ">=2.9.0,<3.0.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = ">=3.3.0,<4.0.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.0,<2.0.0"}
python-multipart = ">=0.0.6,<1.0.0"

# Validation
pydantic = ">=2.5.0,<3.0.0"
pydantic-settings = ">=2.1.0,<3.0.0"
email-validator = ">=2.1.0,<3.0.0"

# Redis & Celery
redis = ">=5.0.0,<6.0.0"
celery = ">=5.3.0,<6.0.0"

# AWS SDK
boto3 = ">=1.34.0,<2.0.0"

# HTTP Client
httpx = ">=0.25.0,<1.0.0"

# YAML support
pyyaml = ">=6.0.0,<7.0.0"

# Environment
python-dotenv = ">=1.0.0,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0,<9.0.0"
pytest-asyncio = ">=0.21.0,<1.0.0"
hypothesis = ">=6.92.0,<7.0.0"
black = ">=23.0.0,<25.0.0"
ruff = ">=0.1.0,<1.0.0"
mypy = ">=1.7.0,<2.0.0"
pre-commit = ">=3.6.0,<4.0.0"

[tool.poetry.group.test.dependencies]
pytest = ">=7.4.0,<9.0.0"
pytest-asyncio = ">=0.21.0,<1.0.0"
pytest-cov = ">=4.1.0,<5.0.0"
hypothesis = ">=6.92.0,<7.0.0"
httpx = ">=0.25.0,<1.0.0"

[project.urls]
Homepage = "https://github.com/mpango/erp-backend"
Documentation = "https://docs.mpango.io"
Repository = "https://github.com/mpango/erp-backend"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "alembic/",
    "tests/",
]

[tool.coverage.run]
source = ["api", "core", "crud", "database", "models", "schemas"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
