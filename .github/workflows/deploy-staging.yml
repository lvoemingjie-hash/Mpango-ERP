# =============================================================================
# Track E2: Staging Deployment Pipeline
#
# Triggers on push to main. Runs backend tests as gatekeeper.
# Tests always run; image publication requires explicit manual opt-in.
# =============================================================================
name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly opt in to image publication and staging handoff
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ---------------------------------------------------------------------------
  # Gate: Backend Tests (must pass before any deployment)
  # ---------------------------------------------------------------------------
  test:
    name: Backend Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout-minutes }}
    strategy:
      # Five instance-independent tasks (R6): each leg is an isolated runner
      # with its own PG16/Redis7/credentials/database. fail-fast stays false
      # so independent legs keep their evidence when one leg fails; a failed
      # leg still fails the workflow — nothing below swallows a failure.
      fail-fast: false
      max-parallel: 2
      matrix:
        # Hard budget cap: 30+30+50+25+25 = 160 runner-minutes total.
        include:
          - shard: runtime-a
            job-timeout-minutes: 30
            pytest-timeout: 18m
            expected-files: "93"
            expected-nodes: "1655"
          - shard: runtime-b
            job-timeout-minutes: 30
            pytest-timeout: 18m
            expected-files: "97"
            expected-nodes: "1651"
          - shard: topology
            job-timeout-minutes: 50
            pytest-timeout: 38m
            expected-files: "39"
            expected-nodes: "798"
          - shard: invariants-jwt
            job-timeout-minutes: 25
            pytest-timeout: 13m
            expected-files: "3"
            expected-nodes: "92"
          - shard: task-managed-pg
            job-timeout-minutes: 25
            pytest-timeout: 13m
            expected-files: "4"
            expected-nodes: "92"
    env:
      CI_OWNER_LABEL: zcode-mvp-invariants-ci-deploy-staging-r6
      # R6R1 (F-01) intended ONE credential-store path visible to the supply
      # and publication steps. R6R3 corrects the mechanism: job-level env
      # supports only github/needs/strategy/matrix/vars/secrets/inputs
      # contexts — NOT runner — so the store path is registered once in the
      # PG-start step via GITHUB_ENV ($RUNNER_TEMP shell variable at line
      # start, before any docker call). GitHub's context-availability table:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability

    steps:
      - uses: actions/checkout@v4
        with:
          # E-01 (R6R5): the u6h2/u6h3 forbidden-path drift gate runs
          # `git diff --name-only 6a8ddcf3...` — that baseline object is
          # unreachable under the default fetch-depth:1 checkout (run
          # 37735586099 triage). Full history is supplied HERE, in the test
          # job only; the build/deploy job checkouts are untouched.
          fetch-depth: 0

      - name: Verify frozen git baseline is resolvable (read-only, fail-closed)
        run: |
          # E-01 (R6R5): prove the frozen BASE_REF resolves BEFORE any test
          # body runs. Read-only cat-file; named refusal, no skip/ignore
          # fallback, no change to BASE_REF / FORBIDDEN_EDIT_PATHS.
          if ! git cat-file -e 6a8ddcf348e9b1bdcc902929011e6212cc675cf8^{commit}; then
            echo "GIT_BASELINE_UNRESOLVABLE: 6a8ddcf348e9b1bdcc902929011e6212cc675cf8^{commit} absent from this checkout — the forbidden-path drift gate cannot run; refusing"
            exit 1
          fi
          echo "git baseline 6a8ddcf3... resolvable (full history present)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Start task-owned Postgres 16 (labeled, exact ID recorded)
        run: |
          # R6R3: register the task credential-store PATH (never a secret
          # value) once, before any docker call, so every later step —
          # supply wrapper, sanitizer, cleanup — resolves the SAME absolute
          # store path through the GITHUB_ENV channel.
          echo "CI_CREDENTIALS_FILE=$RUNNER_TEMP/c91-task-credentials.env" >> "$GITHUB_ENV"
          PW="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$PW"
          # R6R1 (F-05): the admin credential crosses to docker through the
          # environment-NAME channel (-e POSTGRES_PASSWORD, no value on the
          # docker argv / process listing).
          export POSTGRES_PASSWORD="$PW"
          NAME="c91-r6-pg-${{ matrix.shard }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CID=$(docker run -d --name "$NAME" --label mpango.owner="$CI_OWNER_LABEL" -p 127.0.0.1::5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD postgres:16-alpine)
          PGPORT=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$CID")
          {
            echo "CI_PG_CONTAINER_ID=$CID"
            echo "CI_PG_PORT=$PGPORT"
            echo "CI_PG_ADMIN_PASSWORD=$PW"
          } >> "$GITHUB_ENV"
          echo "PG container $CID on 127.0.0.1:$PGPORT (shard ${{ matrix.shard }}, label mpango.owner=$CI_OWNER_LABEL)"

      - name: Start task-owned Redis 7 (labeled, exact ID recorded)
        run: |
          NAME="c91-r6-redis-${{ matrix.shard }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CID=$(docker run -d --name "$NAME" --label mpango.owner="$CI_OWNER_LABEL" -p 127.0.0.1::6379 redis:7-alpine)
          RPORT=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$CID")
          echo "CI_REDIS_CONTAINER_ID=$CID" >> "$GITHUB_ENV"
          echo "CI_REDIS_PORT=$RPORT" >> "$GITHUB_ENV"
          echo "Redis container $CID on 127.0.0.1:$RPORT (shard ${{ matrix.shard }})"

      - name: Provision test database via the five-phase product recipe
        id: provision
        env:
          CI_PG_HOST: 127.0.0.1
          CI_PG_ADMIN_USER: postgres
          CI_TEST_DB: test_ci_mpango
          CI_TEST_TENANT_SCHEMA: t_test
          CI_REDIS_URL: redis://127.0.0.1:${{ env.CI_REDIS_PORT }}/0
        run: |
          bash tools/ci/bootstrap_backend_test_db.sh --github-env "$GITHUB_ENV" --env-file "$RUNNER_TEMP/c91-test-env.sh" --plan-file "$RUNNER_TEMP/supply-plan.json" --profile-dir "$RUNNER_TEMP"

      - name: Generate and register the synthetic test-admin password (R6R5 E-02)
        if: steps.provision.outcome == 'success'
        run: |
          # E-02 (R6R5): the S6E permission-registry tests consume
          # MPANGO_TEST_ADMIN_PASSWORD through
          # backend/scripts/seed_test_tenant.py::_require_admin_password
          # (its MISSING/EMPTY/WHITESPACE refusals are product behavior and
          # stay untouched — TEST_ADMIN_PASSWORD_MISSING is the wrong-token
          # error, MPANGO_TEST_ADMIN_PASSWORD is the real key). A fresh random
          # short-lived value is generated AFTER the supply wrapper wrote the
          # store (so the wrapper never overwrites it) and BEFORE collect/body.
          # Masked first, then carried ONLY through env-NAME channels: appended
          # to the SAME private credential store the sanitizer reads, and
          # exported to later steps via GITHUB_ENV. Never on any argv, never
          # in plain logs; not reused from any PG/migration/app/operator/
          # reporting password.
          SECRETS="${CI_CREDENTIALS_FILE:-}"
          if [ -z "$SECRETS" ] || [ ! -s "$SECRETS" ]; then
            echo "TEST_ADMIN_CHANNEL_UNAVAILABLE: credential store missing/empty after provision — refusing"
            exit 1
          fi
          APW="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$APW"
          chmod 600 "$SECRETS" || true
          printf 'MPANGO_TEST_ADMIN_PASSWORD=%s\n' "$APW" >> "$SECRETS"
          echo "MPANGO_TEST_ADMIN_PASSWORD=$APW" >> "$GITHUB_ENV"
          echo "MPANGO_TEST_ADMIN_PASSWORD registered (masked; store + GITHUB_ENV channels only)"

      - name: Cut frozen runtime shard argfiles (fail-closed)
        if: steps.provision.outcome == 'success'
        run: |
          python tools/ci/prepare_test_evidence.py shard-plan --plan "$RUNNER_TEMP/supply-plan.json" --profile-dir "$RUNNER_TEMP"

      - name: Pre-pull exact postgres:16 image for the task-owned helper (R6R5 E-03)
        if: steps.provision.outcome == 'success' && matrix.shard == 'task-managed-pg'
        run: |
          # E-03 (R6R5): task_owned_pg_resources._postgres_image_id() inspects
          # the EXACT local tag postgres:16 (sha256:-prefixed 71-char Id) and
          # the helper starts containers with --pull=never, so a missing local
          # image failed INSIDE task_postgres AFTER its volume was already
          # created (run 37735586086 triage: 1F + 67E). This leg-scoped
          # precondition pulls and inspects BEFORE any collect/body that may
          # call task_postgres, and refuses by name before the helper can
          # create anything. No retagging (postgres:16-alpine never impersonates
          # postgres:16); the helper itself is untouched (--pull=never, image
          # Id, labels, mounts, role checks all unchanged).
          if ! docker pull postgres:16; then
            echo "POSTGRES_IMAGE_PULL_FAILED: docker pull postgres:16 failed — refusing before the task-owned helper can create any volume"
            exit 1
          fi
          IMAGE_ID="$(docker image inspect postgres:16 --format '{{.Id}}')"
          if [ "${#IMAGE_ID}" -ne 71 ] || [ "${IMAGE_ID:0:7}" != "sha256:" ]; then
            echo "POSTGRES_IMAGE_ID_REFUSED: unexpected image Id shape for postgres:16 — refusing before the task-owned helper can create any volume"
            exit 1
          fi
          DIGEST="$(docker image inspect postgres:16 --format '{{index .RepoDigests 0}}')"
          {
            echo "postgres:16 image id: $IMAGE_ID"
            echo "postgres:16 repo digest: $DIGEST"
          } | tee "$RUNNER_TEMP/postgres-image-record.txt"
          echo "postgres:16 local image precondition satisfied (id + digest recorded for later reconciliation)"

      - name: Shard gate (argfile + collect-only membership check)
        if: steps.provision.outcome == 'success'
        run: |
          test -s "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests" || { echo "shard ${{ matrix.shard }} argfile missing/empty; refusing to fall back to full collection"; exit 1; }
          # F-02 (R6R2): shard-verify refusals echo identities (nodeid/file
          # examples) — raw stdout/stderr goes to private runner staging; the
          # console sees only the fixed refusal category and the step fails.
          if ! python tools/ci/prepare_test_evidence.py shard-verify --plan "$RUNNER_TEMP/supply-plan.json" --shard "${{ matrix.shard }}" --argfile "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests" --expected-files "${{ matrix.expected-files }}" --diagnostics-file "$RUNNER_TEMP/gate-verify-files.diag.json" > "$RUNNER_TEMP/gate-verify-files.log" 2>&1; then
            echo "shard-verify (file gate) REFUSED: $(grep -oE 'REFUSED: [A-Z_]+' "$RUNNER_TEMP/gate-verify-files.log" | head -1 | cut -d' ' -f2 || echo category-unavailable)"
            exit 1
          fi
          echo "shard-verify (file gate): membership exact"
          cd backend
          set -a; . "$RUNNER_TEMP/c91-test-env.sh"; set +a
          case "${{ matrix.shard }}" in
            topology|task-managed-pg) export MPANGO_ALLOW_TEMP_DB_CREATE=1 ;;
            invariants-jwt) export MPANGO_ENV=staging ;;
          esac
          case "${{ matrix.shard }}" in
            task-managed-pg) export C91_R3_RESOURCE_ROOT="$RUNNER_TEMP/c91-resource-root"; mkdir -p "$C91_R3_RESOURCE_ROOT"; chmod 700 "$C91_R3_RESOURCE_ROOT" ;;
          esac
          # R6R4: backend/pytest.ini addopts carries -v, so a single CLI -q
          # cancels to verbosity 0 and --collect-only emits the verbose tree
          # (run37713568999 gate refusals). The explicit numeric verbosity
          # locks the plain-nodeid collect format the frozen canonical
          # parses, regardless of ini -v or injected PYTEST_ADDOPTS; ini
          # addopts (incl. --strict-markers) still apply unchanged.
          if ! poetry run pytest --collect-only --verbosity=-1 $(xargs -a "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests") > "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt" 2> "$RUNNER_TEMP/collect-${{ matrix.shard }}.err"; then
            echo "collect-only FAILED (raw output in private runner staging)"
            exit 1
          fi
          cd ..
          if ! python tools/ci/prepare_test_evidence.py shard-verify --plan "$RUNNER_TEMP/supply-plan.json" --shard "${{ matrix.shard }}" --argfile "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests" --expected-files "${{ matrix.expected-files }}" --collect "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt" --expected-nodes "${{ matrix.expected-nodes }}" --diagnostics-file "$RUNNER_TEMP/gate-verify-nodes.diag.json" > "$RUNNER_TEMP/gate-verify-nodes.log" 2>&1; then
            echo "shard-verify (node gate) REFUSED: $(grep -oE 'REFUSED: [A-Z_]+' "$RUNNER_TEMP/gate-verify-nodes.log" | head -1 | cut -d' ' -f2 || echo category-unavailable)"
            exit 1
          fi
          echo "shard-verify (node gate): canonical nodeid set exact"

      - name: Run shard test body (single pytest invocation)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        run: |
          set -o pipefail
          set -a; . "$RUNNER_TEMP/c91-test-env.sh"; set +a
          case "${{ matrix.shard }}" in
            topology|task-managed-pg) export MPANGO_ALLOW_TEMP_DB_CREATE=1 ;;
            invariants-jwt) export MPANGO_ENV=staging ;;
          esac
          case "${{ matrix.shard }}" in
            task-managed-pg) export C91_R3_RESOURCE_ROOT="$RUNNER_TEMP/c91-resource-root"; mkdir -p "$C91_R3_RESOURCE_ROOT"; chmod 700 "$C91_R3_RESOURCE_ROOT" ;;
          esac
          poetry run python - "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv" <<'PYOBS' &
          import csv, os, sys, time
          import psycopg2
          out_path = sys.argv[1]
          dsn = os.environ.get("TEST_ADMIN_DATABASE_URL", "")
          if not dsn:
              sys.exit(0)
          DETAIL = ("SELECT COALESCE(datname,''), COALESCE(usename,''), COALESCE(application_name,''), "
                    "COALESCE(state,''), COALESCE(wait_event_type,''), count(*) "
                    "FROM pg_stat_activity GROUP BY 1,2,3,4,5")
          TOTAL = "SELECT count(*) FROM pg_stat_activity"
          with open(out_path, "w", newline="") as fh:
              w = csv.writer(fh)
              w.writerow(["kind","ts","datname","usename","application_name","state","wait_event_type","connections"])
              while True:
                  try:
                      conn = psycopg2.connect(dsn, application_name="c91_observer")
                      conn.set_session(readonly=True, autocommit=True)
                      with conn.cursor() as cur:
                          cur.execute(TOTAL)
                          w.writerow(["total", time.time(), "", "", "", "", "", cur.fetchone()[0]])
                          cur.execute(DETAIL)
                          for row in cur.fetchall():
                              w.writerow(["detail", time.time()] + list(row))
                      fh.flush()
                      conn.close()
                  except Exception:
                      pass
                  time.sleep(5)
          PYOBS
          OBS_PID=$!
          echo "shard ${{ matrix.shard }} test body started (raw pytest output goes to private runner staging, never to this console)"
          set +e
          timeout --signal=INT --kill-after=60s ${{ matrix.pytest-timeout }} poetry run pytest $(xargs -a "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests") -q --tb=short --junitxml=../junit-${{ matrix.shard }}.xml > "$RUNNER_TEMP/pytest-stdout.txt" 2> "$RUNNER_TEMP/pytest-stderr.txt"
          rc=$?
          set -e
          kill "$OBS_PID" 2>/dev/null || true
          wait "$OBS_PID" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv" ] || echo "observation_absent" > "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv"
          echo "$rc" > "$RUNNER_TEMP/pytest-rc.txt"
          echo "shard ${{ matrix.shard }} pytest rc=$rc"
          exit "$rc"

      - name: Reconcile junit against the frozen collect (fail-closed closure)
        if: always()
        run: |
          RC_ARG="$(cat "$RUNNER_TEMP/pytest-rc.txt" 2>/dev/null || echo never_ran)"
          # F-02 (R6R2): refusal detail (unknown/ambiguous identities,
          # not-run examples) stays in private staging; the console sees the
          # fixed category only.
          if python tools/ci/prepare_test_evidence.py reconcile-junit --junit "junit-${{ matrix.shard }}.xml" --collect "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt" --shard "${{ matrix.shard }}" --pytest-rc "$RC_ARG" --receipt "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.json" --not-run-file "$RUNNER_TEMP/not-run-${{ matrix.shard }}.nodeids.txt" --diagnostics-file "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.diag.json" > "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.log" 2>&1; then
            echo "reconcile complete: receipt + not-run list recorded"
          else
            echo "reconcile REFUSED: $(grep -oE 'REFUSED: [A-Z_]+' "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.log" | head -1 | cut -d' ' -f2 || echo category-unavailable) — recording an evidence gap"
            echo "reconcile_refused" > "$RUNNER_TEMP/GAP-reconcile.txt"
          fi

      - name: Sanitize shard evidence for publication (fail-closed)
        if: always()
        run: |
          set -u
          PUB="$RUNNER_TEMP/publish"
          mkdir -p "$PUB"
          SECRETS="${CI_CREDENTIALS_FILE:-}"
          if [ -z "$SECRETS" ] || [ ! -s "$SECRETS" ]; then
            echo "task credential store missing/empty — refusing the ENTIRE payload outlet (no admin-only fallback)"
            python tools/ci/prepare_test_evidence.py refusal-receipt --reason secrets_store_unavailable --out "$PUB/publication-refusal.json" || true
            echo "publication_refused_all" > "$RUNNER_TEMP/GAP-publication.txt"
            cp "$RUNNER_TEMP"/GAP-*.txt "$PUB"/ 2>/dev/null || true
            exit 0
          fi
          # R6R3: store-INTEGRITY gate stays FIRST for every payload —
          # including valid empty logs (the sanitizer's empty-log branch
          # must never be reachable under an incomplete store). Mirrors the
          # tool's --require-keys set at the outlet. R6R5 (E-02): the
          # synthetic test-admin channel joins the required set — a store
          # that was never registered with MPANGO_TEST_ADMIN_PASSWORD means
          # the run could not have supplied what the S6E tests consume, so
          # the WHOLE outlet refuses rather than publish evidence from an
          # unsupplied credential channel.
          for req_key in MIGRATE_PASSWORD APP_PASSWORD OPERATOR_PASSWORD REPORTING_PASSWORD SECRET_KEY MPANGO_TEST_ADMIN_PASSWORD; do
            if ! grep -q "^${req_key}=" "$SECRETS"; then
              echo "task credential store incomplete (missing ${req_key}) — refusing the ENTIRE payload outlet"
              python tools/ci/prepare_test_evidence.py refusal-receipt --reason secrets_store_incomplete --out "$PUB/publication-refusal.json" || true
              echo "publication_refused_all" > "$RUNNER_TEMP/GAP-publication.txt"
              cp "$RUNNER_TEMP"/GAP-*.txt "$PUB"/ 2>/dev/null || true
              exit 0
            fi
          done
          # R6R5 (E-02): the sanitizer's required-key set (tool-level, per
          # call) now includes MPANGO_TEST_ADMIN_PASSWORD alongside the
          # frozen five; the two lists stay in lockstep with the outlet
          # gate above.
          REQUIRE_KEYS="MIGRATE_PASSWORD,APP_PASSWORD,OPERATOR_PASSWORD,REPORTING_PASSWORD,SECRET_KEY,MPANGO_TEST_ADMIN_PASSWORD"
          sanitize() {
            src="$1"; dst="$2"; required="$3"; allow_empty="${4:-no}"
            if [ ! -f "$src" ]; then
              if [ "$required" = "required" ]; then
                echo "required input absent: $src — recording an evidence gap (absence is not completeness)"
                echo "required_input_absent" > "$RUNNER_TEMP/GAP-$dst.txt"
              else
                echo "skip (absent, optional): $src"
              fi
              return 0
            fi
            EXTRA_ARGS="--require-keys $REQUIRE_KEYS"
            if [ "$allow_empty" = "allow-empty" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --allow-empty"
            fi
            if python tools/ci/prepare_test_evidence.py sanitize --input "$src" --output "$PUB/$dst" --receipt "$PUB/$dst.receipt.json" --secrets-file "$SECRETS" --extra-env CI_PG_ADMIN_PASSWORD $EXTRA_ARGS; then
              echo "sanitized: $dst"
            else
              echo "sanitize REFUSED for $src — recording an evidence gap; the raw file is NOT uploaded"
              echo "sanitize_refused" > "$RUNNER_TEMP/GAP-$dst.txt"
            fi
          }
          sanitize "junit-${{ matrix.shard }}.xml" "junit-${{ matrix.shard }}.sanitized.xml" required
          sanitize "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt" "collect-${{ matrix.shard }}.sanitized.txt" required
          sanitize "$RUNNER_TEMP/shard-plan.receipt.json" "shard-plan-${{ matrix.shard }}.sanitized.json" required
          sanitize "$RUNNER_TEMP/supply-plan.json" "supply-plan-${{ matrix.shard }}.sanitized.json" required
          # F-01 (R6R2): shell redirection creates these files even on a
          # quiet run — an EXISTING zero-byte log is valid evidence (the
          # sanitizer acknowledges it with an honest empty receipt); a
          # MISSING file above is still a required-input GAP.
          sanitize "$RUNNER_TEMP/pytest-stdout.txt" "pytest-stdout-${{ matrix.shard }}.sanitized.txt" required allow-empty
          sanitize "$RUNNER_TEMP/pytest-stderr.txt" "pytest-stderr-${{ matrix.shard }}.sanitized.txt" required allow-empty
          sanitize "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.json" "reconcile-${{ matrix.shard }}.sanitized.json" optional
          sanitize "$RUNNER_TEMP/not-run-${{ matrix.shard }}.nodeids.txt" "not-run-${{ matrix.shard }}.sanitized.nodeids.txt" optional
          sanitize "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv" "connections-${{ matrix.shard }}.sanitized.csv" optional
          # F-02 (R6R2): the tool diagnostic logs (gate/reconcile raw output
          # and identity-bearing diagnostics) are published ONLY through this
          # sanitizer channel, never to the console
          sanitize "$RUNNER_TEMP/gate-verify-files.log" "gate-verify-files-${{ matrix.shard }}.sanitized.log" optional allow-empty
          sanitize "$RUNNER_TEMP/gate-verify-nodes.log" "gate-verify-nodes-${{ matrix.shard }}.sanitized.log" optional allow-empty
          sanitize "$RUNNER_TEMP/collect-${{ matrix.shard }}.err" "collect-${{ matrix.shard }}.sanitized.err" optional allow-empty
          sanitize "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.log" "reconcile-${{ matrix.shard }}.sanitized.log" optional allow-empty
          sanitize "$RUNNER_TEMP/gate-verify-files.diag.json" "gate-verify-files-${{ matrix.shard }}.sanitized.diag.json" optional allow-empty
          sanitize "$RUNNER_TEMP/gate-verify-nodes.diag.json" "gate-verify-nodes-${{ matrix.shard }}.sanitized.diag.json" optional allow-empty
          sanitize "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.diag.json" "reconcile-${{ matrix.shard }}.sanitized.diag.json" optional allow-empty
          cp "$RUNNER_TEMP"/GAP-*.txt "$PUB"/ 2>/dev/null || true

      - name: Upload sanitized shard evidence (never masks the test rc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.shard }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/publish

      - name: Cleanup task-owned resources (exact IDs re-verified before removal)
        if: always()
        run: |
          set -u
          fail=0
          for cid_name in CI_PG_CONTAINER_ID CI_REDIS_CONTAINER_ID; do
            cid="${!cid_name:-}"
            if [ -n "$cid" ]; then
              label="$(docker inspect --format '{{ index .Config.Labels "mpango.owner" }}' "$cid" 2>/dev/null || true)"
              if [ "$label" = "$CI_OWNER_LABEL" ]; then
                docker rm -f -v "$cid" || fail=1
              else
                echo "container $cid has a mismatched/unknown owner label — NOT removed (exact-ID discipline, no prune/prefix deletion)"
                fail=1
              fi
            fi
          done
          rm -f "$CI_CREDENTIALS_FILE" "$RUNNER_TEMP/c91-test-env.sh" || fail=1
          rm -rf "$RUNNER_TEMP/c91-resource-root" || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "cleanup_failed" > "$RUNNER_TEMP/GAP-cleanup.txt"
          fi
          # Disclosure: on cancellation or a hard job-level timeout this step
          # may never execute. Hosted runners are decommissioned by the
          # platform and their containers/filesystems are destroyed with the
          # VM; no per-item destruction receipt is claimed in that case.

      - name: Assert shard outcome (pytest rc is final; uploads never mask it)
        if: always()
        run: |
          rc="never_ran"
          if [ -f "$RUNNER_TEMP/pytest-rc.txt" ]; then rc="$(cat "$RUNNER_TEMP/pytest-rc.txt")"; fi
          gaps=0
          for g in "$RUNNER_TEMP"/GAP-*.txt; do
            if [ -e "$g" ]; then gaps=$((gaps+1)); fi
          done
          if [ "$rc" != "0" ]; then
            echo "shard ${{ matrix.shard }} pytest rc=$rc (124=outer timeout) — the job FAILS regardless of upload outcomes"
            exit 1
          fi
          if [ "$gaps" -ne 0 ]; then
            echo "evidence gaps present ($gaps): sanitized publication incomplete on a green run — the job FAILS"
            exit 1
          fi
          echo "shard ${{ matrix.shard }} green with complete sanitized evidence"

  # Build: Docker image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Integrity Gate (Verify Scripts Exist)
        run: |
          IMAGE="${{ steps.meta.outputs.tags }}"
          echo "Verifying critical files in $IMAGE..."

          # Verify seed_demo_data.py exists (required for staging data seeding)
          echo "Checking /app/scripts/seed_demo_data.py..."
          docker run --rm $IMAGE ls -la /app/scripts/seed_demo_data.py

          # Verify create_wholesaler.py exists (required for tenant creation)
          echo "Checking /app/scripts/create_wholesaler.py..."
          docker run --rm $IMAGE ls -la /app/scripts/create_wholesaler.py

          # Verify onboard_tenant.py exists (required for tenant onboarding)
          echo "Checking /app/scripts/onboard_tenant.py..."
          docker run --rm $IMAGE ls -la /app/scripts/onboard_tenant.py

          echo "✅ Build integrity gate passed - all critical scripts verified"

  # ---------------------------------------------------------------------------
  # Deploy: (mock) — outputs instructions for manual staging deploy
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Staging
    needs: [test, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Staging deployment summary
        run: |
          echo "============================================="
          echo "  Mpango ERP — Staging Deployment Ready"
          echo "============================================="
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "To deploy manually:"
          echo "  1. SSH into staging server"
          echo "  2. docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "  3. docker compose -f docker-compose.prod.yml up -d"
          echo "  4. bash scripts/reset-staging.sh  # (first time only)"
          echo ""
          echo "Or use the production-like local run:"
          echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build"
          echo ""
