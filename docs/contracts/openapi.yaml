openapi: 3.1.0
info:
  title: Mpango ERP API
  description: |
    Multi-tenant ERP system for African wholesale-retail operations.

    ## Authentication
    All endpoints except `/auth/login` require Bearer token authentication.
    The JWT token contains `tenant_id`, `tenant_schema`, and `user_id` claims.

    ## Multi-Tenancy
    - Login requires `tenant_code` to identify the wholesaler
    - All subsequent requests use tenant info from JWT claims
    - Data is isolated per tenant schema

    ## Authorization
    Endpoints are protected by RBAC permissions as defined in RBAC Matrix (MVP).
  version: 1.0.0
  contact:
    name: Mpango ERP Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.mpango.io/api/v1
    description: Production

tags:
  - name: auth
    description: Authentication and token management
  - name: users
    description: User management (requires users:* permissions)
  - name: roles
    description: Role management (requires roles:* permissions)
  - name: orders
    description: Sales order management (requires orders:* permissions)
  - name: catalog-products
    description: Tenant-local product identity and stable sellable packaging units
  - name: payments
    description: Payment management (requires payments:* permissions)

security:
  - BearerAuth: []

paths:
  # ============================================================
  # AUTH ENDPOINTS
  # ============================================================
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate user and get tokens
      description: |
        Multi-tenant login flow:
        1. Validate tenant_code against public.wholesalers
        2. Derive tenant_schema from wholesaler.id
        3. Authenticate user in tenant schema
        4. Return JWT with tenant claims
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request or inactive user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout (client should discard tokens)
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get current authenticated user info
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # USER ENDPOINTS
  # ============================================================
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users with pagination
      description: Requires `users:read` permission
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [users]
      operationId: createUser
      summary: Create a new user
      description: Requires `users:create` permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{user_id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Get user by ID
      description: Requires `users:read` permission
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [users]
      operationId: updateUser
      summary: Update user
      description: Requires `users:update` permission
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [users]
      operationId: deleteUser
      summary: Soft delete user (deactivate)
      description: Requires `users:deactivate` permission
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/roles:
    put:
      tags: [users]
      operationId: assignUserRoles
      summary: Assign roles to user
      description: Requires `roles:assign` permission
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
      responses:
        '200':
          description: Roles assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # ROLE ENDPOINTS
  # ============================================================
  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List all roles
      description: Requires `roles:read` permission
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # CATALOG PRODUCT ENDPOINTS
  # ============================================================
  /catalog-products:
    get:
      tags: [catalog-products]
      operationId: listCatalogProducts
      summary: List tenant catalog products and their sellable packaging units
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated catalog product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductListResponse'
    post:
      tags: [catalog-products]
      operationId: createCatalogProduct
      summary: Create one product with one or more stable sellable units
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogProductCreate'
      responses:
        '201':
          description: Catalog product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductResponse'
        '409':
          description: A SKU code already exists or was previously retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog-products/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [catalog-products]
      operationId: getCatalogProduct
      summary: Get one catalog product
      responses:
        '200':
          description: Catalog product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [catalog-products]
      operationId: updateCatalogProduct
      summary: Rename, classify, activate, or deactivate a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogProductUpdate'
      responses:
        '200':
          description: Catalog product updated without rewriting order snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductResponse'

  /catalog-products/{product_id}/sellable-units:
    post:
      tags: [catalog-products]
      operationId: addSellableUnit
      summary: Add an independently stocked packaging option
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellableUnitCreate'
      responses:
        '201':
          description: Sellable unit added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductResponse'

  /catalog-products/{product_id}/sellable-units/{sellable_unit_id}:
    put:
      tags: [catalog-products]
      operationId: updateSellableUnit
      summary: Update packaging metadata or availability; SKU code is immutable
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sellable_unit_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellableUnitUpdate'
      responses:
        '200':
          description: Sellable unit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductResponse'

  # ============================================================
  # ORDER ENDPOINTS
  # ============================================================
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders with pagination
      description: Requires Bearer token authentication
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: retailer_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [orders]
      operationId: createOrder
      summary: Create a new order
      description: |
        Creates order with status=draft.
        `wholesaler_id` is inferred from the authenticated token (tenant_id claim).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Retailer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{order_id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get order by ID
      description: Requires Bearer token authentication
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{order_id}/confirm:
    post:
      tags: [orders]
      operationId: confirmOrder
      summary: Confirm order
      description: |
        Transitions order from draft → confirmed.
        Request body should be empty or `{}`.
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # PAYMENTS ENDPOINTS
  # ============================================================
  /payments:
    post:
      tags: [payments]
      operationId: createPayment
      summary: Create a payment
      description: |
        Creates a payment record linked to an order.

        Payment methods:
        - cash: records a payment, no transaction_id required
        - transfer: mobile money (e.g. M-Pesa). `transaction_id` is REQUIRED.
          `Idempotency-Key` header is REQUIRED for transfer payments.
        - credit: records a credit sale (increases outstanding balance exposure)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Validation error (e.g. missing idempotency key for transfer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate transaction id or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{order_id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel order
      description: |
        Can cancel from draft or confirmed status.
      parameters:
        - $ref: '#/components/parameters/OrderIdParam'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


# ============================================================
# COMPONENTS
# ============================================================
components:
  # ----------------------------------------------------------
  # Security Schemes
  # ----------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token containing claims:
        - user_id: UUID
        - tenant_id: UUID
        - tenant_schema: string (e.g., t_<uuid>)
        - exp: expiration timestamp

  # ----------------------------------------------------------
  # Parameters
  # ----------------------------------------------------------
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1

    SizeParam:
      name: size
      in: query
      description: Items per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    UserIdParam:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrderIdParam:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  # ----------------------------------------------------------
  # Reusable Responses
  # ----------------------------------------------------------
  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ----------------------------------------------------------
  # Schemas
  # ----------------------------------------------------------
  schemas:
    # ========== Common ==========
    Pagination:
      type: object
      required: [page, size, total, pages]
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        pages:
          type: integer
          example: 10

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        meta:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [success, error, timestamp]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Input validation failed
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time

    # ========== Payment ==========
    PaymentMethod:
      type: string
      enum: [cash, transfer, credit]

    PaymentStatus:
      type: string
      enum: [pending, completed]

    PaymentCreateRequest:
      type: object
      required: [order_id, amount, method]
      properties:
        order_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
        method:
          $ref: '#/components/schemas/PaymentMethod'
        transaction_id:
          type: string
          description: External transaction reference (required for transfer)
          maxLength: 64

    Payment:
      type: object
      required: [id, order_id, retailer_id, amount, method, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        retailer_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          nullable: true
        amount:
          type: number
          format: float
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Payment'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    MessageResponse:
      type: object
      required: [success, message, timestamp]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        timestamp:
          type: string
          format: date-time

    # ========== Auth ==========
    LoginRequest:
      type: object
      required: [tenant_code, email, password]
      properties:
        tenant_code:
          type: string
          description: Wholesaler code (e.g., ACME01)
          example: ACME01
          minLength: 1
          maxLength: 32
        email:
          type: string
          format: email
          example: admin@acme.com
        password:
          type: string
          format: password
          minLength: 8
          example: Admin123!

    LoginResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [access_token, refresh_token, token_type, user_id, tenant_id, tenant_schema]
          properties:
            access_token:
              type: string
              description: JWT access token
            refresh_token:
              type: string
              description: JWT refresh token
            token_type:
              type: string
              example: bearer
            user_id:
              type: string
              format: uuid
            tenant_id:
              type: string
              format: uuid
            tenant_schema:
              type: string
              example: t_11111111111111111111111111111111
        timestamp:
          type: string
          format: date-time

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    CurrentUserResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [id, email, tenant_id, tenant_schema, roles, permissions]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            full_name:
              type: string
            tenant_id:
              type: string
              format: uuid
            tenant_schema:
              type: string
            roles:
              type: array
              items:
                type: string
              example: [admin]
            permissions:
              type: array
              items:
                type: string
              example: [users:read, users:create, orders:read]
        timestamp:
          type: string
          format: date-time

    # ========== User ==========
    UserCreateRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: newuser@acme.com
        password:
          type: string
          format: password
          minLength: 8
        full_name:
          type: string
          maxLength: 100
          example: John Doe

    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          maxLength: 100
        is_active:
          type: boolean

    User:
      type: object
      required: [id, email, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        is_active:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/User'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    UserListResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
            pagination:
              $ref: '#/components/schemas/Pagination'
        timestamp:
          type: string
          format: date-time

    AssignRolesRequest:
      type: object
      required: [role_ids]
      properties:
        role_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1

    # ========== Role ==========
    Role:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: admin
        description:
          type: string

    RoleListResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        timestamp:
          type: string
          format: date-time

    # ========== Order ==========
    OrderStatus:
      type: string
      enum: [draft, confirmed, cancelled]

    OrderItemCreate:
      type: object
      required: [quantity]
      anyOf:
        - required: [sellable_unit_id]
        - required: [sku_code]
      properties:
        sellable_unit_id:
          type: string
          format: uuid
          description: Stable tenant-local SellableUnit identity
        sku_code:
          type: string
          description: Immutable compatibility selector; if both selectors are supplied they must match
        quantity:
          type: integer
          minimum: 1

    OrderCreateRequest:
      type: object
      required: [retailer_id, items]
      properties:
        retailer_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemCreate'
          minItems: 1
        notes:
          type: string

    OrderItem:
      type: object
      required: [id, identity_status, product_name, sku_code, quantity, unit_price, subtotal]
      properties:
        id:
          type: string
          format: uuid
        sellable_unit_id:
          type: [string, 'null']
          format: uuid
          description: Null only for unmapped legacy lines
        identity_status:
          type: string
          enum: [legacy, linked_legacy, stable]
        product_name:
          type: string
        sku_code:
          type: string
        unit_snapshot:
          type: [string, 'null']
          description: Immutable unit-of-measure snapshot captured when a stable order line is created
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
        subtotal:
          type: number
          format: float

    # ========== Catalog Identity ==========
    SellableUnitCreate:
      type: object
      additionalProperties: false
      required: [sku_code]
      properties:
        sku_code:
          type: string
          minLength: 1
          maxLength: 64
          description: Immutable and never reusable after creation
        unit:
          type: string
          minLength: 1
          maxLength: 32
          default: unit
        package_quantity:
          type: number
          exclusiveMinimum: 0
          default: 1
        is_active:
          type: boolean
          default: true

    SellableUnitUpdate:
      type: object
      additionalProperties: false
      properties:
        unit:
          type: string
          minLength: 1
          maxLength: 32
        package_quantity:
          type: number
          exclusiveMinimum: 0
        is_active:
          type: boolean

    SellableUnit:
      type: object
      required: [id, catalog_product_id, sku_code, unit, package_quantity, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        catalog_product_id:
          type: string
          format: uuid
        sku_code:
          type: string
        unit:
          type: string
        package_quantity:
          type: number
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogProductCreate:
      type: object
      additionalProperties: false
      required: [name, sellable_units]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
          maxLength: 64
        is_active:
          type: boolean
          default: true
        sellable_units:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SellableUnitCreate'

    CatalogProductUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
          maxLength: 64
        is_active:
          type: boolean

    CatalogProduct:
      type: object
      required: [id, name, is_active, sellable_units, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
        is_active:
          type: boolean
        sellable_units:
          type: array
          items:
            $ref: '#/components/schemas/SellableUnit'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogOfferIdentity:
      type: object
      additionalProperties: false
      required: [catalog_product_id, sellable_unit_id, sku_code]
      description: Interface-only identity boundary; it is not a physical pricing or availability authority.
      properties:
        catalog_product_id:
          type: string
          format: uuid
        sellable_unit_id:
          type: string
          format: uuid
        sku_code:
          type: string

    CatalogProductResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CatalogProduct'
        timestamp:
          type: string
          format: date-time

    CatalogProductListResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CatalogProduct'
            pagination:
              $ref: '#/components/schemas/Pagination'
        timestamp:
          type: string
          format: date-time

    Order:
      type: object
      required: [id, wholesaler_id, retailer_id, status, total_amount, items, created_at]
      properties:
        id:
          type: string
          format: uuid
        wholesaler_id:
          type: string
          format: uuid
        retailer_id:
          type: string
          format: uuid
        retailer_name:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_amount:
          type: number
          format: float
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        notes:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Order'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    OrderListResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Order'
            pagination:
              $ref: '#/components/schemas/Pagination'
        timestamp:
          type: string
          format: date-time

    OrderActionResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [order_id, status]
          properties:
            order_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/OrderStatus'
        message:
          type: string
          example: Order confirmed
        timestamp:
          type: string
          format: date-time
