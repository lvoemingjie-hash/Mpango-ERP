version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: mpango_postgres
    environment:
      POSTGRES_DB: mpango_erp
      POSTGRES_USER: mpango
      #${POSTGRES_USER:-mpango}
      POSTGRES_PASSWORD: MpangoDBV0.1.2
      #${POSTGRES_PASSWORD}
    env_file:
      - ${SECRETS_DIR:-./secrets}/prod.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mpango -d mpango_erp" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mpango_network

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: mpango_redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mpango_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mpango_backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://mpango:MpangoDBV0.1.2@postgres:5432/mpango_erp
      - SECRET_KEY=MpangoSecretKeyV0.1.2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mpango_network
    command: poetry run uvicorn main:app --host 0.0.0.0 --port 8000
    #uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mpango_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mpango_network
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    command: npm run dev

volumes:
  postgres_data:
  redis_data:


networks:
  mpango_network:
    driver: bridge
