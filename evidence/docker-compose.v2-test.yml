# DC-12R1-MVP-L1-J1-H2-C-R1-R2-R1-V2 Test Stack
# PostgreSQL 16 + Redis 7 - Fresh isolated stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: dc12r1-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mpango_erp_test
      POSTGRES_USER: mpango_test
      POSTGRES_PASSWORD: test_password_v2_2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpango_test -d mpango_erp_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dc12r1_v2_postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - dc12r1_v2_network

  redis:
    image: redis:7-alpine
    container_name: dc12r1-v2-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dc12r1_v2_redis_data:/data
    ports:
      - "16379:6379"
    networks:
      - dc12r1_v2_network

volumes:
  dc12r1_v2_postgres_data:
  dc12r1_v2_redis_data:

networks:
  dc12r1_v2_network:
    driver: bridge
