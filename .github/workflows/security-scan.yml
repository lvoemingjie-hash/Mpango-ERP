name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  secret-detection:
    name: Detect Secrets in Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: Check for prod.env files
        id: prod-env-check
        run: |
          echo "Checking for prod.env files..."
          if find . -name "prod.env" -o -name "*.prod.env" -o -name "production.env" | grep -q .; then
            echo "❌ ERROR: Production environment files detected in repository!"
            find . -name "prod.env" -o -name "*.prod.env" -o -name "production.env"
            exit 1
          fi
          echo "✅ No prod.env files found"

      - name: Check for secrets/ directory
        id: secrets-dir-check
        run: |
          echo "Checking for secrets/ directory..."
          if [ -d "secrets" ] || [ -d ".secrets" ]; then
            echo "❌ ERROR: Secrets directory detected in repository!"
            ls -la secrets/ 2>/dev/null || ls -la .secrets/ 2>/dev/null
            exit 1
          fi
          echo "✅ No secrets directory found"

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for Gitleaks Pro

      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # Read-only gate: the baseline is compared, never rewritten; findings and
      # tool failures both fail the step. Version pinned for reproducibility.
      - name: Run detect-secrets
        id: detect-secrets
        run: |
          pip install detect-secrets==1.5.0
          tools/ci/secrets_gate.sh

      # Gate logic lives in a tested script; the workflow calls the real
      # implementation (no parallel simulator).
      - name: Check for hardcoded credentials
        id: hardcoded-credentials
        run: tools/ci/hardcoded_creds_gate.sh

      - name: Security scan summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: always() means this summary step ran; it does NOT mean all checks passed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Step outcomes:" >> $GITHUB_STEP_SUMMARY
          echo "- prod.env file detection: ${{ steps.prod-env-check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- secrets/ directory detection: ${{ steps.secrets-dir-check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks secret scanning: ${{ steps.gitleaks.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- TruffleHog secret scanning: ${{ steps.trufflehog.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- detect-secrets read-only baseline gate: ${{ steps.detect-secrets.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Hardcoded credentials gate: ${{ steps.hardcoded-credentials.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Overall job result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  dependency-scan:
    name: Scan Dependencies for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk Security Scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run Safety Check (Python)
        run: |
          pip install safety
          cd backend
          safety check --json || true
