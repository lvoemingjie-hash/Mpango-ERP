# =============================================================================
# Track E2: Staging Deployment Pipeline
#
# Triggers on push to main. Runs backend tests as gatekeeper.
# Tests always run; image publication requires explicit manual opt-in.
# =============================================================================
name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly opt in to image publication and staging handoff
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ---------------------------------------------------------------------------
  # Gate: Backend Tests (must pass before any deployment)
  # ---------------------------------------------------------------------------
  test:
    name: Backend Tests (Gatekeeper)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_OWNER_LABEL: zcode-mvp-invariants-ci-deploy-staging-r3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Start task-owned Postgres 16 (labeled, exact ID recorded)
        run: |
          NAME="c91-r3-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CID=$(docker run -d --name "$NAME" --label mpango.owner="$CI_OWNER_LABEL" -p 127.0.0.1::5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres postgres:16-alpine)
          PGPORT=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$CID")
          echo "CI_PG_CONTAINER_ID=$CID" >> "$GITHUB_ENV"
          echo "CI_PG_PORT=$PGPORT" >> "$GITHUB_ENV"
          echo "PG container $CID on 127.0.0.1:$PGPORT (label mpango.owner=$CI_OWNER_LABEL)"

      - name: Start task-owned Redis 7 (labeled, exact ID recorded)
        run: |
          NAME="c91-r3-redis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CID=$(docker run -d --name "$NAME" --label mpango.owner="$CI_OWNER_LABEL" -p 127.0.0.1::6379 redis:7-alpine)
          RPORT=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$CID")
          echo "CI_REDIS_CONTAINER_ID=$CID" >> "$GITHUB_ENV"
          echo "CI_REDIS_PORT=$RPORT" >> "$GITHUB_ENV"
          echo "Redis container $CID on 127.0.0.1:$RPORT (label mpango.owner=$CI_OWNER_LABEL)"

      - name: Provision test database via the five-phase product recipe
        id: provision
        env:
          CI_PG_HOST: 127.0.0.1
          CI_PG_ADMIN_USER: postgres
          CI_PG_ADMIN_PASSWORD: postgres
          CI_TEST_DB: test_ci_mpango
          CI_TEST_TENANT_SCHEMA: t_test
        run: |
          bash tools/ci/bootstrap_backend_test_db.sh --github-env "$GITHUB_ENV" --env-file "$RUNNER_TEMP/c91-test-env.sh" --plan-file "$RUNNER_TEMP/supply-plan.json" --profile-dir "$RUNNER_TEMP"
          echo "CI_REDIS_URL=redis://127.0.0.1:$CI_REDIS_PORT/0" >> "$GITHUB_ENV"

      - name: Run backend tests (runtime profile)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        run: |
          . "$RUNNER_TEMP/c91-test-env.sh"
          timeout --signal=INT --kill-after=60s 20m poetry run pytest $(xargs -a "$RUNNER_TEMP/profile-runtime.tests") -q --tb=short --junitxml=../junit-runtime.xml

      - name: Run backend tests (topology profile)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        env:
          MPANGO_ALLOW_TEMP_DB_CREATE: "1"
        run: |
          . "$RUNNER_TEMP/c91-test-env.sh"
          timeout --signal=INT --kill-after=60s 20m poetry run pytest $(xargs -a "$RUNNER_TEMP/profile-topology.tests") -q --tb=short --junitxml=../junit-topology.xml

      - name: Run backend tests (invariants-jwt profile)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        run: |
          set -a; . "$RUNNER_TEMP/c91-test-env.sh"; set +a
          MPANGO_ENV=staging timeout --signal=INT --kill-after=60s 20m poetry run pytest $(xargs -a "$RUNNER_TEMP/profile-invariants-jwt.tests") -q --tb=short --junitxml=../junit-invariants.xml

      - name: Run backend tests (task-managed-pg profile)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        env:
          C91_R3_RESOURCE_ROOT: ${{ runner.temp }}/c91-resource-root
        run: |
          mkdir -p "$C91_R3_RESOURCE_ROOT" && chmod 700 "$C91_R3_RESOURCE_ROOT"
          . "$RUNNER_TEMP/c91-test-env.sh"
          timeout --signal=INT --kill-after=60s 20m poetry run pytest $(xargs -a "$RUNNER_TEMP/profile-task-managed-pg.tests") -q --tb=short --junitxml=../junit-taskmanaged.xml

      - name: Upload test evidence (junit + supply plan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          if-no-files-found: ignore
          path: |
            junit-runtime.xml
            junit-topology.xml
            junit-invariants.xml
            junit-taskmanaged.xml
            ${{ runner.temp }}/supply-plan.json

  # Build: Docker image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Integrity Gate (Verify Scripts Exist)
        run: |
          IMAGE="${{ steps.meta.outputs.tags }}"
          echo "Verifying critical files in $IMAGE..."

          # Verify seed_demo_data.py exists (required for staging data seeding)
          echo "Checking /app/scripts/seed_demo_data.py..."
          docker run --rm $IMAGE ls -la /app/scripts/seed_demo_data.py

          # Verify create_wholesaler.py exists (required for tenant creation)
          echo "Checking /app/scripts/create_wholesaler.py..."
          docker run --rm $IMAGE ls -la /app/scripts/create_wholesaler.py

          # Verify onboard_tenant.py exists (required for tenant onboarding)
          echo "Checking /app/scripts/onboard_tenant.py..."
          docker run --rm $IMAGE ls -la /app/scripts/onboard_tenant.py

          echo "✅ Build integrity gate passed - all critical scripts verified"

  # ---------------------------------------------------------------------------
  # Deploy: (mock) — outputs instructions for manual staging deploy
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Staging
    needs: [test, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Staging deployment summary
        run: |
          echo "============================================="
          echo "  Mpango ERP — Staging Deployment Ready"
          echo "============================================="
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "To deploy manually:"
          echo "  1. SSH into staging server"
          echo "  2. docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "  3. docker compose -f docker-compose.prod.yml up -d"
          echo "  4. bash scripts/reset-staging.sh  # (first time only)"
          echo ""
          echo "Or use the production-like local run:"
          echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build"
          echo ""
