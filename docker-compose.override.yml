# Dev override — exposes individual service ports for direct debugging
# Active by default when using: docker compose up
# Ignore for staging: docker compose -f docker-compose.yml up
services:
  postgres:
    ports:
      - "5432:5432"
  redis:
    ports:
      - "6379:6379"
  backend:
    ports:
      - "8000:8000"
    environment:
      - MPANGO_ENV=production
