# =============================================================================
# Vibecoder Directive Runner — Hardened v4.6 (Parser-Only Gate)
#
# v4.5 Changes (over v4.4):
#   A. Final Gate reads Mode from report before field checks
#   B. INVENTORY_ONLY mode: requires report/verdict/mode/runner/host/run-url/
#      transport-healthy/script_only_complete; skips Leo/product gates 4-9
#   C. VALIDATION_GATE mode: full R7 requirements preserved (Gates 4-9)
#   D. No warnings — missing fields = hard FAIL for both modes
#   E. Fixed missing fi in Gate 5 else block (v4.4 bug)
#
# Last updated: 2026-05-19 (v4.6: parser-only mode + repo script execution)
# =============================================================================
name: Vibecoder Directive Runner

on:
  push:
    branches:
      - automation/cto-directives
    paths:
      - "docs/ai-directives/vibecoder/pending/**.md"
  workflow_dispatch:

concurrency:
  group: vibecoder-directive-runner
  cancel-in-progress: false

permissions:
  contents: write

env:
  GITHUB_SERVER_URL: ${{ github.server_url }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_RUN_ID: ${{ github.run_id }}

jobs:
  run-vibecoder-directive:
    name: Run Vibecoder CTO Directive
    runs-on: [self-hosted, linux, mpango-lubuntu]
    timeout-minutes: 90

    steps:
      # ── A. Debug Diagnostics ────────────────────────────────────────
      - name: Debug — Environment diagnostics
        shell: bash
        run: |
          echo "=== R7 Debug Diagnostics ==="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
          echo "GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
          echo "pwd=$(pwd)"
          echo "hostname=$(hostname)"
          echo "whoami=$(whoami)"
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo ""

          # Check existing file structure (before checkout)
          echo "=== Pre-checkout file scan ==="
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f 2>/dev/null | grep -E 'ai-reports|directive|run_directive' || echo "(no matches)"

          echo ""
          echo "=== Runner script ==="
          ls -la "$HOME/.openclaw/mpango-directive-runner/run_directive.sh" 2>/dev/null || echo "(script not found)"
          echo ""
          echo "=== Repo runner script ==="
          ls -la "$GITHUB_WORKSPACE/directives/scripts/runner/run_directive.sh" 2>/dev/null || echo "(repo script not checked out yet)"

          echo ""
          echo "=== Fallback reports ==="
          ls -la "$HOME/.openclaw/mpango-directive-runner/fallback-reports/" 2>/dev/null || echo "(none)"

      # ── B. Checkout directive branch ─────────────────────────────────
      - name: Checkout directive branch
        uses: actions/checkout@v4
        with:
          ref: automation/cto-directives
          fetch-depth: 0
          path: directives

      # ── B. Checkout validation target (full product repo) ────────────
      - name: Checkout full repo (validation target)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: validation-target

      - name: Show trigger context
        shell: bash
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo ""
          echo "=== directives ==="
          git -C directives log -1 --oneline
          git -C directives status --short
          echo ""
          echo "=== validation-target ==="
          git -C validation-target branch -a 2>/dev/null | head -5 || echo "(not a git repo)"
          git -C validation-target log -1 --oneline 2>/dev/null || echo "(no commits)"
          echo ""
          echo "=== directives/pending ==="
          ls -la directives/docs/ai-directives/vibecoder/pending/ 2>/dev/null || echo "(no pending dir)"

      # ── Run hardened directive runner (v3.9) ────────────────────────
      - name: Run hardened directive runner (v3.9)
        id: runner
        shell: bash
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          RUNNER_SCRIPT="$GITHUB_WORKSPACE/directives/scripts/runner/run_directive.sh"
          HELPER_SCRIPT="$GITHUB_WORKSPACE/directives/scripts/runner/extract_leo_evidence.py"
          chmod +x "$RUNNER_SCRIPT" "$HELPER_SCRIPT"
          bash -n "$RUNNER_SCRIPT"
          python3 -m py_compile "$HELPER_SCRIPT"
          "$RUNNER_SCRIPT" \
            "$GITHUB_WORKSPACE/directives" \
            "$GITHUB_WORKSPACE/validation-target"

      # ── D. Push reports to reports/lubuntu-validation ─────────────────
      - name: Push reports to reports/lubuntu-validation
        if: always()
        id: push-reports
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== R7 Push Step ==="

          # Read metadata from script output
          METADATA_FILE="$GITHUB_WORKSPACE/generated-reports/_metadata.txt"
          REPORT_SRC=""
          REPORT_BASENAME=""

          if [ -f "$METADATA_FILE" ]; then
            echo "Metadata file found:"
            cat "$METADATA_FILE"
            echo ""
            REPORT_BASENAME="$(grep '^REPORT_BASENAME=' "$METADATA_FILE" | cut -d= -f2)"
            REPORT_DECLARED_PATH="$(grep '^REPORT_DECLARED_PATH=' "$METADATA_FILE" | cut -d= -f2)"
          fi

          # Primary: generated-reports directory
          if [ -n "$REPORT_BASENAME" ] && [ -f "$GITHUB_WORKSPACE/generated-reports/$REPORT_BASENAME" ]; then
            REPORT_SRC="$GITHUB_WORKSPACE/generated-reports/$REPORT_BASENAME"
            echo "Found primary report: $REPORT_SRC"
          else
            echo "Primary report not found at generated-reports/$REPORT_BASENAME"
          fi

          # Fallback: fallback-reports directory
          if [ -z "$REPORT_SRC" ]; then
            FALLBACK_DIR="$HOME/.openclaw/mpango-directive-runner/fallback-reports"
            echo "Checking fallback: $FALLBACK_DIR"
            if [ -d "$FALLBACK_DIR" ] && [ -n "$(ls -A "$FALLBACK_DIR" 2>/dev/null)" ]; then
              REPORT_SRC="$(find "$FALLBACK_DIR" -name '*.md' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
              echo "Found fallback report: $REPORT_SRC"
            fi
          fi

          # HARD FAIL: no report anywhere
          if [ -z "$REPORT_SRC" ] || [ ! -f "$REPORT_SRC" ]; then
            echo "FATAL: No report found in generated-reports OR fallback-reports"
            exit 1
          fi

          echo "Using report: $REPORT_SRC"

          # Clone reports branch
          REPORTS_CHECKOUT="$GITHUB_WORKSPACE/reports-branch"
          rm -rf "$REPORTS_CHECKOUT" 2>/dev/null || true
          git clone --depth 1 --branch reports/lubuntu-validation \
            https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git \
            "$REPORTS_CHECKOUT" 2>&1

          # Determine target path on reports branch
          if [ -z "$REPORT_DECLARED_PATH" ]; then
            REPORT_DECLARED_PATH="docs/ai-reports/lubuntu/$REPORT_BASENAME"
          fi

          TARGET_DIR="$(dirname "$REPORTS_CHECKOUT/$REPORT_DECLARED_PATH")"
          mkdir -p "$TARGET_DIR"

          # Copy report to declared path
          cp "$REPORT_SRC" "$REPORTS_CHECKOUT/$REPORT_DECLARED_PATH"
          echo "Copied to: $REPORTS_CHECKOUT/$REPORT_DECLARED_PATH"

          cd "$REPORTS_CHECKOUT"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "directive-runner[bot]"
            git config user.email "directive-runner[bot]@users.noreply.github.com"
            git commit -m "auto: directive execution report [run ${{ github.run_id }}]"
            git pull --rebase origin reports/lubuntu-validation 2>&1 || true
            git push origin reports/lubuntu-validation 2>&1
            echo "Report pushed to reports/lubuntu-validation"
          fi

          echo "push-success=true" >> "$GITHUB_OUTPUT"

      # ── E. Final Gate — Verify report on reports branch ──────────────
      - name: Final Gate — Verify report on reports/lubuntu-validation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== R7 Final Gate ==="

          # Read metadata to know what to verify
          METADATA_FILE="$GITHUB_WORKSPACE/generated-reports/_metadata.txt"
          REPORT_BASENAME=""
          REPORT_DECLARED_PATH=""
          DIRECTIVE_FILE=""

          if [ -f "$METADATA_FILE" ]; then
            REPORT_BASENAME="$(grep '^REPORT_BASENAME=' "$METADATA_FILE" | cut -d= -f2-)"
            REPORT_DECLARED_PATH="$(grep '^REPORT_DECLARED_PATH=' "$METADATA_FILE" | cut -d= -f2-)"
            DIRECTIVE_FILE="$(grep '^DIRECTIVE_FILE=' "$METADATA_FILE" | cut -d= -f2-)"
          fi

          if [ -z "$REPORT_BASENAME" ] || [ -z "$REPORT_DECLARED_PATH" ]; then
            echo "FATAL: Cannot determine report path from metadata"
            echo "  METADATA_FILE: $METADATA_FILE"
            exit 1
          fi

          echo "Expected report path: $REPORT_DECLARED_PATH"
          echo "Expected report basename: $REPORT_BASENAME"
          echo "Directive file: ${DIRECTIVE_FILE:-unknown}"

          # Clone fresh copy of reports branch
          VERIFY_DIR="$GITHUB_WORKSPACE/reports-verify"
          rm -rf "$VERIFY_DIR" 2>/dev/null || true
          rm -rf "$VERIFY_DIR"
          git clone --depth 1 --branch reports/lubuntu-validation \
            https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git \
            "$VERIFY_DIR" 2>&1 || {
              echo "FATAL: Cannot clone reports/lubuntu-validation"
              exit 1
            }

          VERIFY_FILE="$VERIFY_DIR/$REPORT_DECLARED_PATH"

          # ── Gate 1: Report file exists ──
          if [ ! -f "$VERIFY_FILE" ]; then
            echo "FATAL: Report does NOT exist on reports/lubuntu-validation"
            echo "  Expected: $REPORT_DECLARED_PATH"
            echo "  Checked: $VERIFY_FILE"
            ls -la "$VERIFY_DIR/docs/ai-reports/lubuntu/" 2>/dev/null || echo "  (directory missing)"
            exit 1
          fi
          echo "Gate 1 PASS: Report exists"

          REPORT_CONTENT="$(cat "$VERIFY_FILE")"

          # Detect mode from report
          DIRECTIVE_MODE="VALIDATION_GATE"
          if echo "$REPORT_CONTENT" | grep -qE "Mode.*PARSER_ONLY"; then
            DIRECTIVE_MODE="PARSER_ONLY"
          elif echo "$REPORT_CONTENT" | grep -qE "Mode.*INVENTORY_ONLY"; then
            DIRECTIVE_MODE="INVENTORY_ONLY"
          fi
          echo "Directive mode: $DIRECTIVE_MODE"

          # ── Gate 2: Verdict is PASS_FOR_CTO_REVIEW ──
          if ! echo "$REPORT_CONTENT" | grep -q "PASS_FOR_CTO_REVIEW"; then
            echo "FATAL: Verdict is not PASS_FOR_CTO_REVIEW"
            echo "  Found verdict: $(echo "$REPORT_CONTENT" | grep -i 'verdict' | head -3)"
            exit 1
          fi
          echo "Gate 2 PASS: Verdict = PASS_FOR_CTO_REVIEW"

          # ── Gate 3: Required fields present ──

          # ── Gate 3: Mode-required fields present ──
          # Base fields required for ALL modes
          REQUIRED_FIELDS=(
            "github_runner_name"
            "host_name"
            "Run URL"
            "fallbackUsed|Transport Health"
          )

          # Mode-specific required fields
          if [ "$DIRECTIVE_MODE" = "INVENTORY_ONLY" ]; then
            REQUIRED_FIELDS+=(
              "script_only_complete"
            )
          elif [ "$DIRECTIVE_MODE" = "PARSER_ONLY" ]; then
            REQUIRED_FIELDS+=(
              "script_only_complete"
              "directive_sections_extracted"
              "Leo Invoked"
              "PARSER_PREFLIGHT_COUNT"
              "PARSER_VALIDATION_COUNT"
              "PARSER_TOTAL_COUNT"
            )
          elif [ "$DIRECTIVE_MODE" = "VALIDATION_GATE" ]; then
            REQUIRED_FIELDS+=(
              "Leo Invoked"
              "COMMANDS_EXECUTED"
              "PREFLIGHT|Preflight Commands"
              "VALIDATION|Product Validation"
              "APP_IMPORT_SMOKE|App Import Smoke"
              "RECEIVABLES_SUITE|Receivables Suite"
              "PHASE5_PAYMENT_REGRESSION|Phase 5 Payment"
              "SCHEMA_CONTRACT|Schema Contract"
              "PRODUCT_CODE_MODIFIED|Product Code Modified"
              "PRODUCT_BRANCH_PUSHED|Product Branch Pushed"
            )
          fi

          for field in "${REQUIRED_FIELDS[@]}"; do
            if ! echo "$REPORT_CONTENT" | grep -qE "$field"; then
              echo "FATAL: Missing required field: $field (mode=$DIRECTIVE_MODE)"
              exit 1
            fi
            echo "Gate 3 PASS: Found field '$field'"
          done

          # ── Gate 4: Leo invoked check (VALIDATION_GATE only) ──
          if [ "$DIRECTIVE_MODE" = "INVENTORY_ONLY" ]; then
            echo "Gate 4 SKIP: INVENTORY_ONLY mode — Leo not required"
          elif [ "$DIRECTIVE_MODE" = "PARSER_ONLY" ]; then
            if ! echo "$REPORT_CONTENT" | grep -qE "Leo Invoked[[:space:]]*\|[[:space:]]*false[[:space:]]*\|"; then
              echo "FATAL: PARSER_ONLY must not invoke Leo"
              echo "  Found: $(echo "$REPORT_CONTENT" | grep 'Leo Invoked' | head -3)"
              exit 1
            fi
            echo "Gate 4 PASS: PARSER_ONLY did not invoke Leo"
          else
            if echo "$REPORT_CONTENT" | grep -qE "Leo Invoked.*false"; then
              echo "FATAL: Leo was NOT invoked"
              exit 1
            fi
            echo "Gate 4 PASS: Leo invoked = yes"
          fi

          # ── Gate 5: COMMANDS_EXECUTED (VALIDATION_GATE only) ──
          if [ "$DIRECTIVE_MODE" = "INVENTORY_ONLY" ]; then
            echo "Gate 5 SKIP: INVENTORY_ONLY mode — COMMANDS_EXECUTED not required"
          elif [ "$DIRECTIVE_MODE" = "PARSER_ONLY" ]; then
            if ! echo "$REPORT_CONTENT" | grep -qE "PARSER_PREFLIGHT_COUNT[[:space:]]*\|[[:space:]]*5[[:space:]]*\|"; then
              echo "FATAL: PARSER_PREFLIGHT_COUNT is not 5"
              exit 1
            fi
            if ! echo "$REPORT_CONTENT" | grep -qE "PARSER_VALIDATION_COUNT[[:space:]]*\|[[:space:]]*4[[:space:]]*\|"; then
              echo "FATAL: PARSER_VALIDATION_COUNT is not 4"
              exit 1
            fi
            if ! echo "$REPORT_CONTENT" | grep -qE "PARSER_TOTAL_COUNT[[:space:]]*\|[[:space:]]*9[[:space:]]*\|"; then
              echo "FATAL: PARSER_TOTAL_COUNT is not 9"
              exit 1
            fi
            echo "Gate 5 PASS: PARSER_ONLY counts = 5/4/9"
          else
            if ! echo "$REPORT_CONTENT" | grep -qE "COMMANDS_EXECUTED[[:space:]]*\|[[:space:]]*9/9[[:space:]]*\|"; then
              echo "FATAL: COMMANDS_EXECUTED is not 9/9"
              echo "  Found: $(echo "$REPORT_CONTENT" | grep 'COMMANDS_EXECUTED' | head -3)"
              exit 1
            fi
            echo "Gate 5 PASS: COMMANDS_EXECUTED = 9/9"
          fi

          # ── Gate 6: Transport healthy (ALL modes) ──
          if echo "$REPORT_CONTENT" | grep -qiE "fallbackUsed.*true"; then
            echo "FATAL: fallbackUsed=true — transport was degraded"
            exit 1
          fi
          if echo "$REPORT_CONTENT" | grep -qiE "Transport Health.*degraded"; then
            echo "FATAL: Transport health is degraded"
            exit 1
          fi
          echo "Gate 6 PASS: Transport healthy / fallbackUsed=false"

          # ── Gate 7: Product code not modified (VALIDATION_GATE only) ──
          if [ "$DIRECTIVE_MODE" != "VALIDATION_GATE" ]; then
            echo "Gate 7 SKIP: $DIRECTIVE_MODE mode — product code check not required"
          else
            if echo "$REPORT_CONTENT" | grep -qiE "Product Code Modified.*yes"; then
              echo "FATAL: Product code was modified"
              exit 1
            fi
            echo "Gate 7 PASS: Product code not modified"
          fi

          # ── Gate 8: Product branch not pushed (VALIDATION_GATE only) ──
          if [ "$DIRECTIVE_MODE" != "VALIDATION_GATE" ]; then
            echo "Gate 8 SKIP: $DIRECTIVE_MODE mode — product branch check not required"
          else
            if echo "$REPORT_CONTENT" | grep -qiE "Product Branch Pushed.*yes"; then
              echo "FATAL: Product branch was pushed"
              exit 1
            fi
            echo "Gate 8 PASS: Product branch not pushed"
          fi

          # ── Gate 9: Product validation suites (VALIDATION_GATE only) ──
          if [ "$DIRECTIVE_MODE" != "VALIDATION_GATE" ]; then
            echo "Gate 9 SKIP: $DIRECTIVE_MODE mode — validation suites not required"
          else
            # 9a: App Import Smoke != unknown
            if echo "$REPORT_CONTENT" | grep -qE "App Import Smoke[[:space:]]*\|[[:space:]]*unknown"; then
              echo "FATAL: APP_IMPORT_SMOKE = unknown (no validation ran)"
              exit 1
            fi
            APP_IMPORT_LINE="$(echo "$REPORT_CONTENT" | grep -E "App Import Smoke[[:space:]]*\|" | head -1 || true)"
            if echo "$APP_IMPORT_LINE" | grep -qiE "(fail|blocked|error)"; then
              echo "FATAL: APP_IMPORT_SMOKE contains failing or blocked evidence"
              echo "  Found: $APP_IMPORT_LINE"
              exit 1
            fi
            if echo "$REPORT_CONTENT" | grep -qE "ghost-qa-tier2|Ghost QA Tier 2|tier2_finance_receivables"; then
              if ! echo "$APP_IMPORT_LINE" | grep -q "ghost_qa_tier2_journey=pass"; then
                echo "FATAL: Tier 2 Ghost QA run is missing human journey pass evidence"
                echo "  Found: $APP_IMPORT_LINE"
                exit 1
              fi
            fi
            # 9b: Receivables Suite != unknown
            if echo "$REPORT_CONTENT" | grep -qE "Receivables Suite[[:space:]]*\|[[:space:]]*unknown"; then
              echo "FATAL: RECEIVABLES_SUITE = unknown (no validation ran)"
              exit 1
            fi
            RECEIVABLES_LINE="$(echo "$REPORT_CONTENT" | grep -E "Receivables Suite[[:space:]]*\|" | head -1 || true)"
            if echo "$RECEIVABLES_LINE" | grep -qiE "([1-9][0-9]* failed|error|blocked)"; then
              echo "FATAL: RECEIVABLES_SUITE contains failing or blocked evidence"
              echo "  Found: $RECEIVABLES_LINE"
              exit 1
            fi
            # 9c: Phase 5 Payment Regression != unknown
            if echo "$REPORT_CONTENT" | grep -qE "Phase 5 Payment Regression[[:space:]]*\|[[:space:]]*unknown"; then
              echo "FATAL: PHASE5_PAYMENT_REGRESSION = unknown (no validation ran)"
              exit 1
            fi
            PHASE5_LINE="$(echo "$REPORT_CONTENT" | grep -E "Phase 5 Payment Regression[[:space:]]*\|" | head -1 || true)"
            if echo "$PHASE5_LINE" | grep -qiE "([1-9][0-9]* failed|error|blocked)"; then
              echo "FATAL: PHASE5_PAYMENT_REGRESSION contains failing or blocked evidence"
              echo "  Found: $PHASE5_LINE"
              exit 1
            fi
            # 9d: Schema Contract != unknown
            if echo "$REPORT_CONTENT" | grep -qE "Schema Contract[[:space:]]*\|[[:space:]]*unknown"; then
              echo "FATAL: SCHEMA_CONTRACT = unknown (no validation ran)"
              exit 1
            fi
            SCHEMA_LINE="$(echo "$REPORT_CONTENT" | grep -E "Schema Contract[[:space:]]*\|" | head -1 || true)"
            if echo "$SCHEMA_LINE" | grep -qiE "(error|blocked)"; then
              echo "FATAL: SCHEMA_CONTRACT contains error or blocked evidence"
              echo "  Found: $SCHEMA_LINE"
              exit 1
            fi
            # 9e: Schema Contract must not contain 'failed'
            if echo "$REPORT_CONTENT" | grep -qE "Schema Contract[[:space:]]*\|.*[1-9][0-9]* failed"; then
              echo "FATAL: SCHEMA_CONTRACT contains failures"
              echo "  Found: $(echo "$REPORT_CONTENT" | grep 'Schema Contract' | head -3)"
              exit 1
            fi
            # 9f: Final product validation must not have schema skips.
            if echo "$REPORT_CONTENT" | grep -qE "Schema Contract[[:space:]]*\|.*[1-9][0-9]* skipped"; then
              echo "FATAL: SCHEMA_CONTRACT contains skipped tests; live DB evidence is incomplete"
              echo "  Found: $(echo "$REPORT_CONTENT" | grep 'Schema Contract' | head -3)"
              echo "  Skip reasons: $(echo "$REPORT_CONTENT" | grep 'Schema Skip Reasons' | head -3)"
              exit 1
            fi
            echo "Gate 9 PASS: All validation suites present and valid"
          fi

          # ── Gate 10: Target-Commit equals report Commit Hash (VALIDATION_GATE only) ──
          if [ "$DIRECTIVE_MODE" != "VALIDATION_GATE" ]; then
            echo "Gate 10 SKIP: $DIRECTIVE_MODE mode — target commit check not required"
          else
            if [ -z "$DIRECTIVE_FILE" ] || [ ! -f "$DIRECTIVE_FILE" ]; then
              echo "FATAL: Cannot verify Target-Commit because directive file is missing"
              echo "  DIRECTIVE_FILE: ${DIRECTIVE_FILE:-empty}"
              exit 1
            fi

            EXPECTED_COMMIT="$(grep -E '^Target-Commit:' "$DIRECTIVE_FILE" | head -1 | sed 's/^Target-Commit:[[:space:]]*//' | tr -d '`' | awk '{print $1}')"
            REPORT_COMMIT="$(echo "$REPORT_CONTENT" | awk -F'|' '/Commit Hash/ {gsub(/^[ \t]+|[ \t]+$/, "", $3); print $3; exit}' | tr -d '`')"

            if [ -z "$EXPECTED_COMMIT" ]; then
              echo "FATAL: VALIDATION_GATE directive is missing Target-Commit"
              echo "  Directive file: $DIRECTIVE_FILE"
              exit 1
            fi
            if [ -z "$REPORT_COMMIT" ]; then
              echo "FATAL: Report is missing Commit Hash"
              exit 1
            fi
            if [ "$EXPECTED_COMMIT" != "$REPORT_COMMIT" ]; then
              echo "FATAL: Report Commit Hash does not match directive Target-Commit"
              echo "  Target-Commit: $EXPECTED_COMMIT"
              echo "  Report Commit Hash: $REPORT_COMMIT"
              exit 1
            fi
            echo "Gate 10 PASS: Report Commit Hash matches directive Target-Commit"
          fi

          echo ""
          echo "=========================================="
          echo "  ALL GATES PASSED — FINAL GATE PASS"
          echo "=========================================="
          echo "  Report: $REPORT_DECLARED_PATH"
          echo "  Mode:   $DIRECTIVE_MODE"
          echo "  File:   $VERIFY_FILE"
          echo "=========================================="

      # Upload runner logs as artifacts
      - name: Upload runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directive-runner-logs-${{ github.run_id }}
          path: ~/.openclaw/mpango-directive-runner/logs/
          retention-days: 30
          if-no-files-found: warn
