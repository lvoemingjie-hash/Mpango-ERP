apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpango-backend
  namespace: mpango-erp
  labels:
    app: mpango-backend
    version: v0.1.0
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mpango-backend
  template:
    metadata:
      labels:
        app: mpango-backend
        version: v0.1.0
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: mpango-erp/backend:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          # S2-4: Kubernetes health probes
          # Liveness probe - checks if process is alive (/healthz)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          
          # Readiness probe - checks if ready to accept traffic (/readyz)
          # Performs deep checks: DB connectivity, Redis connectivity
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # S2-1: All mandatory environment variables from Secret
          env:
            # Environment mode (REQUIRED)
            - name: MPANGO_ENV
              valueFrom:
                secretKeyRef:
                  name: mpango-backend-secrets
                  key: MPANGO_ENV
            
            # Database connection (REQUIRED)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mpango-backend-secrets
                  key: DATABASE_URL
            
            - name: DATABASE_ECHO
              value: "false"
            
            # Redis connection (REQUIRED)
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mpango-backend-secrets
                  key: REDIS_URL
            
            # Security settings (REQUIRED)
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mpango-backend-secrets
                  key: SECRET_KEY
            
            - name: ALGORITHM
              value: "HS256"
            
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "30"
            
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              value: "7"
            
            # Application settings
            - name: APP_NAME
              value: "Mpango ERP"
            
            - name: DEBUG
              value: "false"
            
            - name: LOG_LEVEL
              value: "INFO"
            
            # Multi-tenancy
            - name: DEFAULT_TENANT_SCHEMA
              value: "t_dev"
            
            # Observability (S2-2, S2-3)
            - name: ENABLE_METRICS
              value: "true"
            
            - name: ENABLE_REQUEST_LOGGING
              value: "true"
            
            # Operational settings
            - name: REQUEST_TIMEOUT_SECONDS
              value: "30"
            
            - name: DB_POOL_SIZE
              value: "5"
            
            - name: DB_MAX_OVERFLOW
              value: "10"
            
            - name: DB_CONNECT_TIMEOUT
              value: "10"
            
            # CORS origins (comma-separated in env, parsed by app)
            - name: CORS_ORIGINS
              value: '["http://localhost:3000","http://localhost:5173"]'
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: mpango-backend
  namespace: mpango-erp
  labels:
    app: mpango-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: mpango-backend
