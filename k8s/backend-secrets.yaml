# Kubernetes Secret for Mpango ERP Backend
# S2-1 COMPLIANCE: All required secrets must be set before deployment
#
# WARNING: This file is a template. DO NOT commit actual secret values to git!
# Use kubectl or a secrets management tool (e.g., Sealed Secrets, Vault) to create secrets.
#
# To create the secret manually:
# kubectl create secret generic mpango-backend-secrets \
#   --from-literal=MPANGO_ENV=production \
#   --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#   --from-literal=REDIS_URL='redis://host:6379/0' \
#   --from-literal=SECRET_KEY='your-secure-secret-key-min-32-chars' \
#   -n mpango-erp

apiVersion: v1
kind: Secret
metadata:
  name: mpango-backend-secrets
  namespace: mpango-erp
  labels:
    app: mpango-erp
    component: backend
type: Opaque
stringData:
  # S2-1: REQUIRED - Environment mode (production/test)
  # Production enforces strict validation
  MPANGO_ENV: "production"
  
  # S2-1: REQUIRED - PostgreSQL connection string
  # Format: postgresql://username:password@host:port/database
  # Production: Must NOT use localhost or default credentials
  DATABASE_URL: "postgresql://mpango:secure-password@postgres-service:5432/mpango_erp"
  
  # S2-1: REQUIRED - Redis connection string
  # Format: redis://host:port/db
  # Production: Must NOT use localhost
  REDIS_URL: "redis://redis-service:6379/0"
  
  # S2-1: REQUIRED - JWT secret key (min 32 characters)
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  # Must NOT contain 'dev', 'change-me', or be default value
  SECRET_KEY: "change-this-to-a-secure-random-key-min-32-chars-long"
