name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  secret-detection:
    name: Detect Secrets in Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check for prod.env files
        id: prod-env-check
        run: |
          echo "Checking for prod.env files..."
          if find . -name "prod.env" -o -name "*.prod.env" -o -name "production.env" | grep -q .; then
            echo "❌ ERROR: Production environment files detected in repository!"
            find . -name "prod.env" -o -name "*.prod.env" -o -name "production.env"
            exit 1
          fi
          echo "✅ No prod.env files found"

      - name: Check for secrets/ directory
        id: secrets-dir-check
        run: |
          echo "Checking for secrets/ directory..."
          if [ -d "secrets" ] || [ -d ".secrets" ]; then
            echo "❌ ERROR: Secrets directory detected in repository!"
            ls -la secrets/ 2>/dev/null || ls -la .secrets/ 2>/dev/null
            exit 1
          fi
          echo "✅ No secrets directory found"

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for Gitleaks Pro

      - name: Resolve reachable secret scan range
        id: scan-range
        shell: bash
        env:
          SCAN_EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_DELETED: ${{ github.event.deleted }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          refuse() { echo "::error::SECRET_SCAN_RANGE_$1"; exit 1; }
          zero=0000000000000000000000000000000000000000
          base=""
          case "$SCAN_EVENT" in
            push)
              [[ "$PUSH_DELETED" != true && "$PUSH_AFTER" != "$zero" ]] || refuse DELETED_PUSH
              head="$PUSH_AFTER"
              if [[ "$PUSH_BEFORE" == "$zero" ]]; then
                policy=full-history-first-push
              else
                base="$PUSH_BEFORE"
                [[ -n "$base" ]] || refuse MISSING_PUSH_BEFORE
                policy=incremental-push
              fi
              ;;
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              [[ -n "$base" ]] || refuse MISSING_PR_BASE
              policy=incremental-pr
              ;;
            schedule)
              # No synthetic before: include every commit reachable from head.
              head="$EVENT_SHA"
              policy=full-history-schedule
              ;;
            *) refuse UNSUPPORTED_EVENT ;;
          esac
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$head" != "$zero" ]] || refuse INVALID_HEAD
          [[ "$(git rev-parse --is-shallow-repository)" == false ]] || refuse SHALLOW_HISTORY
          git cat-file -e "${head}^{commit}" 2>/dev/null || refuse HEAD_NOT_REACHABLE
          [[ "$(git rev-parse HEAD)" == "$head" ]] || refuse CHECKOUT_HEAD_MISMATCH
          if [[ -n "$base" ]]; then
            [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != "$zero" ]] || refuse INVALID_BASE
            [[ "$base" != "$head" ]] || refuse EQUAL_ENDPOINTS
            git cat-file -e "${base}^{commit}" 2>/dev/null || refuse BASE_NOT_REACHABLE
            git merge-base --is-ancestor "$base" "$head" || refuse NON_ANCESTOR_BASE
            count="$(git rev-list --count "$base..$head")"
          else
            count="$(git rev-list --count "$head")"
          fi
          [[ "$count" =~ ^[0-9]+$ && "$count" -gt 0 ]] || refuse EMPTY_COVERAGE
          printf 'base=%s\nhead=%s\npolicy=%s\ncommits=%s\n' \
            "$base" "$head" "$policy" "$count" >> "$GITHUB_OUTPUT"
          echo "Secret scan policy: $policy; reachable commits: $count"

      - name: Run TruffleHog
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.scan-range.outputs.base }}
          head: ${{ steps.scan-range.outputs.head }}
          extra_args: --debug --only-verified

      # Read-only gate: the baseline is compared, never rewritten; findings and
      # tool failures both fail the step. Version pinned for reproducibility.
      - name: Run detect-secrets
        id: detect-secrets
        run: |
          pip install detect-secrets==1.5.0
          tools/ci/secrets_gate.sh

      # Gate logic lives in a tested script; the workflow calls the real
      # implementation (no parallel simulator).
      - name: Check for hardcoded credentials
        id: hardcoded-credentials
        run: tools/ci/hardcoded_creds_gate.sh

      - name: Security scan summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: always() means this summary step ran; it does NOT mean all checks passed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Step outcomes:" >> $GITHUB_STEP_SUMMARY
          echo "- prod.env file detection: ${{ steps.prod-env-check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- secrets/ directory detection: ${{ steps.secrets-dir-check.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks secret scanning: ${{ steps.gitleaks.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reachable secret scan range: ${{ steps.scan-range.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- TruffleHog secret scanning: ${{ steps.trufflehog.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- detect-secrets read-only baseline gate: ${{ steps.detect-secrets.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Hardcoded credentials gate: ${{ steps.hardcoded-credentials.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Overall job result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  dependency-scan:
    name: Scan Dependencies for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk Security Scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run Safety Check (Python)
        run: |
          pip install safety
          cd backend
          safety check --json || true
