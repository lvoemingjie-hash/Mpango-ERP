name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  secret-detection:
    name: Detect Secrets in Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: Check for prod.env files
        run: |
          echo "Checking for prod.env files..."
          if find . -name "prod.env" -o -name "*.prod.env" -o -name "production.env" | grep -q .; then
            echo "❌ ERROR: Production environment files detected in repository!"
            find . -name "prod.env" -o -name "*.prod.env" -o -name "production.env"
            exit 1
          fi
          echo "✅ No prod.env files found"

      - name: Check for secrets/ directory
        run: |
          echo "Checking for secrets/ directory..."
          if [ -d "secrets" ] || [ -d ".secrets" ]; then
            echo "❌ ERROR: Secrets directory detected in repository!"
            ls -la secrets/ 2>/dev/null || ls -la .secrets/ 2>/dev/null
            exit 1
          fi
          echo "✅ No secrets directory found"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for Gitleaks Pro

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: New secrets detected!"
            exit 1
          fi
          echo "✅ No new secrets detected"

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for hardcoded credentials..."

          # Check for common password patterns
          if grep -rn --include="*.py" --include="*.js" --include="*.ts" --include="*.java" \
            -E "(password|passwd|pwd|secret|token|api_key|apikey)\s*=\s*[\"'][^\"']{8,}[\"']" . \
            --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.venv --exclude-dir=dist; then
            echo "❌ ERROR: Potential hardcoded credentials detected!"
            exit 1
          fi

          # Check for AWS keys
          if grep -rn --include="*.py" --include="*.js" --include="*.ts" --include="*.env*" \
            -E "(AKIA[0-9A-Z]{16}|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)" . \
            --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.venv; then
            echo "❌ ERROR: AWS credentials detected!"
            exit 1
          fi

          # Check for private keys
          if find . -name "*.pem" -o -name "*.key" -o -name "id_rsa" | \
            grep -v "test" | grep -v "example" | grep -q .; then
            echo "❌ ERROR: Private key files detected!"
            find . -name "*.pem" -o -name "*.key" -o -name "id_rsa" | grep -v "test" | grep -v "example"
            exit 1
          fi

          echo "✅ No hardcoded credentials detected"

      - name: Security scan summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All security checks completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- prod.env file detection" >> $GITHUB_STEP_SUMMARY
          echo "- secrets/ directory detection" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks secret scanning" >> $GITHUB_STEP_SUMMARY
          echo "- TruffleHog secret scanning" >> $GITHUB_STEP_SUMMARY
          echo "- detect-secrets baseline check" >> $GITHUB_STEP_SUMMARY
          echo "- Hardcoded credentials check" >> $GITHUB_STEP_SUMMARY

  dependency-scan:
    name: Scan Dependencies for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk Security Scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run Safety Check (Python)
        run: |
          pip install safety
          cd backend
          safety check --json || true
