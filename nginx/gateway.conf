# =============================================================================
# Mpango ERP — Unified Gateway (Reverse Proxy)
# =============================================================================
# Listens on port 80 as the single entry point for the staging stack.
#
# Routing:
#   /api/      → backend:8000   (FastAPI)
#   /health*   → backend:8000   (Health probes)
#   /healthz   → backend:8000   (K8s liveness)
#   /readyz    → backend:8000   (K8s readiness)
#   /metrics   → backend:8000   (Prometheus scrape)
#   /          → frontend:80    (React SPA)
#
# WHY: Eliminates CORS issues in staging — browser only talks to one origin.
# =============================================================================

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Timeouts ---
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # --- Common proxy headers ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- API routes → Backend ---
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    # --- Health & observability routes → Backend ---
    location /health {
        proxy_pass http://backend_upstream;
    }

    location = /healthz {
        proxy_pass http://backend_upstream;
    }

    location = /readyz {
        proxy_pass http://backend_upstream;
    }

    location = /metrics {
        proxy_pass http://backend_upstream;
    }

    # --- Everything else → Frontend SPA ---
    location / {
        proxy_pass http://frontend_upstream;
    }
}
