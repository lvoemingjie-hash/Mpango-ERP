# =============================================================================
# Track E2: Staging Deployment Pipeline
#
# Triggers on push to main. Runs backend tests as gatekeeper.
# Tests always run; image publication requires explicit manual opt-in.
# =============================================================================
name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly opt in to image publication and staging handoff
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ---------------------------------------------------------------------------
  # Gate: Backend Tests (must pass before any deployment)
  # ---------------------------------------------------------------------------
  test:
    name: Backend Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout-minutes }}
    strategy:
      # Five instance-independent tasks (R6): each leg is an isolated runner
      # with its own PG16/Redis7/credentials/database. fail-fast stays false
      # so independent legs keep their evidence when one leg fails; a failed
      # leg still fails the workflow — nothing below swallows a failure.
      fail-fast: false
      max-parallel: 2
      matrix:
        # Hard budget cap: 30+30+50+25+25 = 160 runner-minutes total.
        include:
          - shard: runtime-a
            job-timeout-minutes: 30
            pytest-timeout: 18m
            expected-files: "93"
            expected-nodes: "1655"
          - shard: runtime-b
            job-timeout-minutes: 30
            pytest-timeout: 18m
            expected-files: "97"
            expected-nodes: "1651"
          - shard: topology
            job-timeout-minutes: 50
            pytest-timeout: 38m
            expected-files: "39"
            expected-nodes: "798"
          - shard: invariants-jwt
            job-timeout-minutes: 25
            pytest-timeout: 13m
            expected-files: "3"
            expected-nodes: "92"
          - shard: task-managed-pg
            job-timeout-minutes: 25
            pytest-timeout: 13m
            expected-files: "4"
            expected-nodes: "92"
    env:
      CI_OWNER_LABEL: zcode-mvp-invariants-ci-deploy-staging-r6
      # R6R1 (F-01): the task credential store is declared at JOB scope so
      # the supply step and every publication/cleanup step resolve the SAME
      # private store path; a step-scoped key would not cross steps.
      CI_CREDENTIALS_FILE: ${{ runner.temp }}/c91-task-credentials.env

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Start task-owned Postgres 16 (labeled, exact ID recorded)
        run: |
          PW="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$PW"
          # R6R1 (F-05): the admin credential crosses to docker through the
          # environment-NAME channel (-e POSTGRES_PASSWORD, no value on the
          # docker argv / process listing).
          export POSTGRES_PASSWORD="$PW"
          NAME="c91-r6-pg-${{ matrix.shard }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CID=$(docker run -d --name "$NAME" --label mpango.owner="$CI_OWNER_LABEL" -p 127.0.0.1::5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD postgres:16-alpine)
          PGPORT=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$CID")
          {
            echo "CI_PG_CONTAINER_ID=$CID"
            echo "CI_PG_PORT=$PGPORT"
            echo "CI_PG_ADMIN_PASSWORD=$PW"
          } >> "$GITHUB_ENV"
          echo "PG container $CID on 127.0.0.1:$PGPORT (shard ${{ matrix.shard }}, label mpango.owner=$CI_OWNER_LABEL)"

      - name: Start task-owned Redis 7 (labeled, exact ID recorded)
        run: |
          NAME="c91-r6-redis-${{ matrix.shard }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CID=$(docker run -d --name "$NAME" --label mpango.owner="$CI_OWNER_LABEL" -p 127.0.0.1::6379 redis:7-alpine)
          RPORT=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$CID")
          echo "CI_REDIS_CONTAINER_ID=$CID" >> "$GITHUB_ENV"
          echo "CI_REDIS_PORT=$RPORT" >> "$GITHUB_ENV"
          echo "Redis container $CID on 127.0.0.1:$RPORT (shard ${{ matrix.shard }})"

      - name: Provision test database via the five-phase product recipe
        id: provision
        env:
          CI_PG_HOST: 127.0.0.1
          CI_PG_ADMIN_USER: postgres
          CI_TEST_DB: test_ci_mpango
          CI_TEST_TENANT_SCHEMA: t_test
          CI_REDIS_URL: redis://127.0.0.1:${{ env.CI_REDIS_PORT }}/0
        run: |
          bash tools/ci/bootstrap_backend_test_db.sh --github-env "$GITHUB_ENV" --env-file "$RUNNER_TEMP/c91-test-env.sh" --plan-file "$RUNNER_TEMP/supply-plan.json" --profile-dir "$RUNNER_TEMP"

      - name: Cut frozen runtime shard argfiles (fail-closed)
        if: steps.provision.outcome == 'success'
        run: |
          python tools/ci/prepare_test_evidence.py shard-plan --plan "$RUNNER_TEMP/supply-plan.json" --profile-dir "$RUNNER_TEMP"

      - name: Shard gate (argfile + collect-only membership check)
        if: steps.provision.outcome == 'success'
        run: |
          test -s "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests" || { echo "shard ${{ matrix.shard }} argfile missing/empty; refusing to fall back to full collection"; exit 1; }
          python tools/ci/prepare_test_evidence.py shard-verify --plan "$RUNNER_TEMP/supply-plan.json" --shard "${{ matrix.shard }}" --argfile "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests" --expected-files "${{ matrix.expected-files }}"
          cd backend
          set -a; . "$RUNNER_TEMP/c91-test-env.sh"; set +a
          case "${{ matrix.shard }}" in
            topology|task-managed-pg) export MPANGO_ALLOW_TEMP_DB_CREATE=1 ;;
            invariants-jwt) export MPANGO_ENV=staging ;;
          esac
          case "${{ matrix.shard }}" in
            task-managed-pg) export C91_R3_RESOURCE_ROOT="$RUNNER_TEMP/c91-resource-root"; mkdir -p "$C91_R3_RESOURCE_ROOT"; chmod 700 "$C91_R3_RESOURCE_ROOT" ;;
          esac
          poetry run pytest --collect-only -q $(xargs -a "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests") > "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt"
          cd ..
          python tools/ci/prepare_test_evidence.py shard-verify --plan "$RUNNER_TEMP/supply-plan.json" --shard "${{ matrix.shard }}" --argfile "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests" --expected-files "${{ matrix.expected-files }}" --collect "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt" --expected-nodes "${{ matrix.expected-nodes }}"

      - name: Run shard test body (single pytest invocation)
        if: steps.provision.outcome == 'success'
        working-directory: backend
        run: |
          set -o pipefail
          set -a; . "$RUNNER_TEMP/c91-test-env.sh"; set +a
          case "${{ matrix.shard }}" in
            topology|task-managed-pg) export MPANGO_ALLOW_TEMP_DB_CREATE=1 ;;
            invariants-jwt) export MPANGO_ENV=staging ;;
          esac
          case "${{ matrix.shard }}" in
            task-managed-pg) export C91_R3_RESOURCE_ROOT="$RUNNER_TEMP/c91-resource-root"; mkdir -p "$C91_R3_RESOURCE_ROOT"; chmod 700 "$C91_R3_RESOURCE_ROOT" ;;
          esac
          poetry run python - "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv" <<'PYOBS' &
          import csv, os, sys, time
          import psycopg2
          out_path = sys.argv[1]
          dsn = os.environ.get("TEST_ADMIN_DATABASE_URL", "")
          if not dsn:
              sys.exit(0)
          DETAIL = ("SELECT COALESCE(datname,''), COALESCE(usename,''), COALESCE(application_name,''), "
                    "COALESCE(state,''), COALESCE(wait_event_type,''), count(*) "
                    "FROM pg_stat_activity GROUP BY 1,2,3,4,5")
          TOTAL = "SELECT count(*) FROM pg_stat_activity"
          with open(out_path, "w", newline="") as fh:
              w = csv.writer(fh)
              w.writerow(["kind","ts","datname","usename","application_name","state","wait_event_type","connections"])
              while True:
                  try:
                      conn = psycopg2.connect(dsn, application_name="c91_observer")
                      conn.set_session(readonly=True, autocommit=True)
                      with conn.cursor() as cur:
                          cur.execute(TOTAL)
                          w.writerow(["total", time.time(), "", "", "", "", "", cur.fetchone()[0]])
                          cur.execute(DETAIL)
                          for row in cur.fetchall():
                              w.writerow(["detail", time.time()] + list(row))
                      fh.flush()
                      conn.close()
                  except Exception:
                      pass
                  time.sleep(5)
          PYOBS
          OBS_PID=$!
          echo "shard ${{ matrix.shard }} test body started (raw pytest output goes to private runner staging, never to this console)"
          set +e
          timeout --signal=INT --kill-after=60s ${{ matrix.pytest-timeout }} poetry run pytest $(xargs -a "$RUNNER_TEMP/profile-${{ matrix.shard }}.tests") -q --tb=short --junitxml=../junit-${{ matrix.shard }}.xml > "$RUNNER_TEMP/pytest-stdout.txt" 2> "$RUNNER_TEMP/pytest-stderr.txt"
          rc=$?
          set -e
          kill "$OBS_PID" 2>/dev/null || true
          wait "$OBS_PID" 2>/dev/null || true
          [ -s "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv" ] || echo "observation_absent" > "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv"
          echo "$rc" > "$RUNNER_TEMP/pytest-rc.txt"
          echo "shard ${{ matrix.shard }} pytest rc=$rc"
          exit "$rc"

      - name: Reconcile junit against the frozen collect (fail-closed closure)
        if: always()
        run: |
          RC_ARG="$(cat "$RUNNER_TEMP/pytest-rc.txt" 2>/dev/null || echo never_ran)"
          if python tools/ci/prepare_test_evidence.py reconcile-junit --junit "junit-${{ matrix.shard }}.xml" --collect "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt" --shard "${{ matrix.shard }}" --pytest-rc "$RC_ARG" --receipt "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.json" --not-run-file "$RUNNER_TEMP/not-run-${{ matrix.shard }}.nodeids.txt"; then
            echo "reconcile complete: receipt + not-run list recorded"
          else
            echo "reconcile REFUSED (missing/truncated/contradictory junit, unknown nodeids, or an incomplete green) — recording an evidence gap"
            echo "reconcile_refused" > "$RUNNER_TEMP/GAP-reconcile.txt"
          fi

      - name: Sanitize shard evidence for publication (fail-closed)
        if: always()
        run: |
          set -u
          PUB="$RUNNER_TEMP/publish"
          mkdir -p "$PUB"
          SECRETS="${CI_CREDENTIALS_FILE:-}"
          if [ -z "$SECRETS" ] || [ ! -s "$SECRETS" ]; then
            echo "task credential store missing/empty — refusing the ENTIRE payload outlet (no admin-only fallback)"
            python tools/ci/prepare_test_evidence.py refusal-receipt --reason secrets_store_unavailable --out "$PUB/publication-refusal.json" || true
            echo "publication_refused_all" > "$RUNNER_TEMP/GAP-publication.txt"
            cp "$RUNNER_TEMP"/GAP-*.txt "$PUB"/ 2>/dev/null || true
            exit 0
          fi
          sanitize() {
            src="$1"; dst="$2"; required="$3"
            if [ ! -f "$src" ]; then
              if [ "$required" = "required" ]; then
                echo "required input absent: $src — recording an evidence gap (absence is not completeness)"
                echo "required_input_absent" > "$RUNNER_TEMP/GAP-$dst.txt"
              else
                echo "skip (absent, optional): $src"
              fi
              return 0
            fi
            if python tools/ci/prepare_test_evidence.py sanitize --input "$src" --output "$PUB/$dst" --receipt "$PUB/$dst.receipt.json" --secrets-file "$SECRETS" --extra-env CI_PG_ADMIN_PASSWORD; then
              echo "sanitized: $dst"
            else
              echo "sanitize REFUSED for $src — recording an evidence gap; the raw file is NOT uploaded"
              echo "sanitize_refused" > "$RUNNER_TEMP/GAP-$dst.txt"
            fi
          }
          sanitize "junit-${{ matrix.shard }}.xml" "junit-${{ matrix.shard }}.sanitized.xml" required
          sanitize "$RUNNER_TEMP/collect-${{ matrix.shard }}.txt" "collect-${{ matrix.shard }}.sanitized.txt" required
          sanitize "$RUNNER_TEMP/shard-plan.receipt.json" "shard-plan-${{ matrix.shard }}.sanitized.json" required
          sanitize "$RUNNER_TEMP/supply-plan.json" "supply-plan-${{ matrix.shard }}.sanitized.json" required
          sanitize "$RUNNER_TEMP/pytest-stdout.txt" "pytest-stdout-${{ matrix.shard }}.sanitized.txt" required
          sanitize "$RUNNER_TEMP/pytest-stderr.txt" "pytest-stderr-${{ matrix.shard }}.sanitized.txt" required
          sanitize "$RUNNER_TEMP/reconcile-${{ matrix.shard }}.json" "reconcile-${{ matrix.shard }}.sanitized.json" optional
          sanitize "$RUNNER_TEMP/not-run-${{ matrix.shard }}.nodeids.txt" "not-run-${{ matrix.shard }}.sanitized.nodeids.txt" optional
          sanitize "$RUNNER_TEMP/connections-${{ matrix.shard }}.csv" "connections-${{ matrix.shard }}.sanitized.csv" optional
          cp "$RUNNER_TEMP"/GAP-*.txt "$PUB"/ 2>/dev/null || true

      - name: Upload sanitized shard evidence (never masks the test rc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.shard }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/publish

      - name: Cleanup task-owned resources (exact IDs re-verified before removal)
        if: always()
        run: |
          set -u
          fail=0
          for cid_name in CI_PG_CONTAINER_ID CI_REDIS_CONTAINER_ID; do
            cid="${!cid_name:-}"
            if [ -n "$cid" ]; then
              label="$(docker inspect --format '{{ index .Config.Labels "mpango.owner" }}' "$cid" 2>/dev/null || true)"
              if [ "$label" = "$CI_OWNER_LABEL" ]; then
                docker rm -f -v "$cid" || fail=1
              else
                echo "container $cid has a mismatched/unknown owner label — NOT removed (exact-ID discipline, no prune/prefix deletion)"
                fail=1
              fi
            fi
          done
          rm -f "$CI_CREDENTIALS_FILE" "$RUNNER_TEMP/c91-test-env.sh" || fail=1
          rm -rf "$RUNNER_TEMP/c91-resource-root" || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "cleanup_failed" > "$RUNNER_TEMP/GAP-cleanup.txt"
          fi
          # Disclosure: on cancellation or a hard job-level timeout this step
          # may never execute. Hosted runners are decommissioned by the
          # platform and their containers/filesystems are destroyed with the
          # VM; no per-item destruction receipt is claimed in that case.

      - name: Assert shard outcome (pytest rc is final; uploads never mask it)
        if: always()
        run: |
          rc="never_ran"
          if [ -f "$RUNNER_TEMP/pytest-rc.txt" ]; then rc="$(cat "$RUNNER_TEMP/pytest-rc.txt")"; fi
          gaps=0
          for g in "$RUNNER_TEMP"/GAP-*.txt; do
            if [ -e "$g" ]; then gaps=$((gaps+1)); fi
          done
          if [ "$rc" != "0" ]; then
            echo "shard ${{ matrix.shard }} pytest rc=$rc (124=outer timeout) — the job FAILS regardless of upload outcomes"
            exit 1
          fi
          if [ "$gaps" -ne 0 ]; then
            echo "evidence gaps present ($gaps): sanitized publication incomplete on a green run — the job FAILS"
            exit 1
          fi
          echo "shard ${{ matrix.shard }} green with complete sanitized evidence"

  # Build: Docker image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Integrity Gate (Verify Scripts Exist)
        run: |
          IMAGE="${{ steps.meta.outputs.tags }}"
          echo "Verifying critical files in $IMAGE..."

          # Verify seed_demo_data.py exists (required for staging data seeding)
          echo "Checking /app/scripts/seed_demo_data.py..."
          docker run --rm $IMAGE ls -la /app/scripts/seed_demo_data.py

          # Verify create_wholesaler.py exists (required for tenant creation)
          echo "Checking /app/scripts/create_wholesaler.py..."
          docker run --rm $IMAGE ls -la /app/scripts/create_wholesaler.py

          # Verify onboard_tenant.py exists (required for tenant onboarding)
          echo "Checking /app/scripts/onboard_tenant.py..."
          docker run --rm $IMAGE ls -la /app/scripts/onboard_tenant.py

          echo "✅ Build integrity gate passed - all critical scripts verified"

  # ---------------------------------------------------------------------------
  # Deploy: (mock) — outputs instructions for manual staging deploy
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Staging
    needs: [test, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Staging deployment summary
        run: |
          echo "============================================="
          echo "  Mpango ERP — Staging Deployment Ready"
          echo "============================================="
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "To deploy manually:"
          echo "  1. SSH into staging server"
          echo "  2. docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          echo "  3. docker compose -f docker-compose.prod.yml up -d"
          echo "  4. bash scripts/reset-staging.sh  # (first time only)"
          echo ""
          echo "Or use the production-like local run:"
          echo "  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build"
          echo ""
