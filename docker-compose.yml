# =============================================================================
# Mpango ERP — Staging Docker Compose
# Version: v0.1.9-contract-polish
#
# Usage (ORDER — the five-stage database setup runs FIRST):
#   cp .env.example .env                          # compose-level secrets
#   cp backend/.env.example backend/.env          # two-role URLs (both
#                                                 # contexts) + secrets
#   backend/scripts/setup.sh                       # 1 provision (admin)
#                                                 # 2 alembic 001..039 (authority)
#                                                 # 3 grants  4 verify
#                                                 # 5 runtime bootstrap
#   docker compose --env-file backend/.env up -d --build   # THEN the runtime
#   docker compose logs -f
#
# Architecture:
#   [Browser] → :80 gateway (nginx)
#                ├── /api/*    → backend:8000 (FastAPI + Uvicorn)
#                └── /*        → frontend:80  (React SPA via nginx)
#              backend depends on postgres + redis
# =============================================================================

# ---------------------------------------------------------------------------
# USAGE CONTRACT (R1-R2): `docker compose up` is NOT a fresh-database
# bootstrap.  The five-stage database setup (backend/scripts/setup.sh:
# provision -> alembic through 039 -> grants -> verify -> runtime bootstrap)
# must complete BEFORE the backend runtime starts.  The postgres service
# below provides the MAINTENANCE database (administrator only); the
# application database is created by provisioning phase 1 and is never
# pre-created or application-schema-initialized here.
# PostgreSQL line: 16 (the identity pinned by the accepted integration
# contract; image digest pinning remains an open hardening item).
# ---------------------------------------------------------------------------
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 (MAINTENANCE database only — see the USAGE CONTRACT below)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # MAINTENANCE database (administrator only).  The application database
      # is a DIFFERENT database (normally mpango_erp): it is NOT pre-created
      # here — provisioning phase 1 creates it owned by the migration
      # authority (an existing wrong-owner database refuses).
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mpango_network

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - mpango_network

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Environment
      - MPANGO_ENV=production
      # Database (REQUIRED, RUNTIME ROLE ONLY, CONTAINER CONTEXT — the Compose
      # service DNS name; the host-side loopback translation lives in
      # backend/.env and is proven equivalent by setup_preflight)
      - DATABASE_URL=${DATABASE_URL_CONTAINER:?DATABASE_URL_CONTAINER must be set to the container-context runtime connection}
      - DATABASE_ECHO=${DATABASE_ECHO:-false}
      # Redis (REQUIRED, CONTAINER CONTEXT)
      - REDIS_URL=${REDIS_URL_CONTAINER:?REDIS_URL_CONTAINER must be set to the container-context Redis connection}
      # Security (REQUIRED)
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Application
      - APP_NAME=${APP_NAME:-Mpango ERP}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # CORS — handled by pydantic-settings default; gateway makes CORS unnecessary
      # Multi-tenancy
      - DEFAULT_TENANT_SCHEMA=${DEFAULT_TENANT_SCHEMA:-t_dev}
      # Observability
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_REQUEST_LOGGING=${ENABLE_REQUEST_LOGGING:-true}
      - ENABLE_SQL_PROFILING=${ENABLE_SQL_PROFILING:-false}
      - SLOW_QUERY_THRESHOLD_MS=${SLOW_QUERY_THRESHOLD_MS:-100}
      # NOTE: no setup-only credentials here (MPANGO_DB_ADMIN_URL,
      # MPANGO_DB_MIGRATE_URL, role passwords, REPORTING_USER_PASSWORD).
      # The reporting password is a setup-time secret consumed by Alembic
      # migration 011 only; setup_preflight refuses it in this environment.
      # Pool & Timeout
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-30}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health/live is a LIVENESS probe (process restart decisions only): it
    # performs no dependency checks and is NOT proof that the five-stage
    # setup completed.  Setup completion is enforced once, at container
    # start, by the entrypoint's read-only readiness gate.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - mpango_network

  # ---------------------------------------------------------------------------
  # Frontend (React SPA — built & served by nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mpango_network

  # ---------------------------------------------------------------------------
  # Gateway (nginx reverse proxy — single entry point)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - mpango_network

  # ---------------------------------------------------------------------------
  # Prometheus (optional — metrics scraping)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    networks:
      - mpango_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  mpango_network:
    driver: bridge
