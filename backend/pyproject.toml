[project]
name = "mpango-erp-backend"
version = "0.1.0"
description = "Multi-tenant ERP system for African wholesale-retail operations"
readme = "../README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Mpango Team"}
]
keywords = ["erp", "fastapi", "multi-tenant", "wholesale", "retail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[tool.poetry]
name = "mpango-erp-backend"
version = "0.1.0"
description = "Multi-tenant ERP system for African wholesale-retail operations"
readme = "../README.md"
authors = ["Mpango Team"]
license = "Proprietary"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

# S2.5 Batch C: All dependencies pinned to exact versions to prevent supply chain attacks
# FastAPI and ASGI
fastapi = "0.128.0"
uvicorn = {extras = ["standard"], version = "0.40.0"}
annotated-doc = "0.0.4"

# Database
sqlalchemy = "2.0.45"
asyncpg = "0.31.0"
alembic = "1.18.1"
psycopg2-binary = "2.9.11"

# Authentication & Security
# S2.5 Batch C: Updated to fix CVE-2026-24486
python-jose = {extras = ["cryptography"], version = "3.5.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
python-multipart = "0.0.22"  # Fixed CVE-2026-24486
# Note: ecdsa 0.19.1 has CVE-2024-23342 but is locked by python-jose
# Mitigation: python-jose uses cryptography library for actual crypto operations
# ecdsa is only used for legacy compatibility. Consider migrating to PyJWT directly.

# Validation
pydantic = "2.12.5"
pydantic-settings = "2.12.0"
email-validator = "2.3.0"

# Redis & Celery
redis = "5.3.1"
celery = "5.6.2"

# AWS SDK
boto3 = "1.42.28"

# HTTP Client
httpx = "0.28.1"

# YAML support
pyyaml = "6.0.3"

# Environment
python-dotenv = "1.2.1"

# Logging
python-json-logger = "2.0.7"

# Metrics
prometheus-client = "0.21.1"

[tool.poetry.group.dev.dependencies]
# S2.5 Batch C: Dev dependencies pinned to exact versions
pytest = "8.4.2"
pytest-asyncio = "0.26.0"
hypothesis = "6.150.2"
black = "24.10.0"
ruff = "0.9.2"
mypy = "1.15.0"
pre-commit = "4.0.1"
locust = "^2.43.2"

[tool.poetry.group.test.dependencies]
# S2.5 Batch C: Test dependencies pinned to exact versions
pytest = "8.4.2"
pytest-asyncio = "0.26.0"
pytest-cov = "4.1.0"
hypothesis = "6.150.2"
httpx = "0.28.1"

[project.urls]
Homepage = "https://github.com/mpango/erp-backend"
Documentation = "https://docs.mpango.io"
Repository = "https://github.com/mpango/erp-backend"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "alembic/",
    "tests/",
]

[tool.coverage.run]
source = ["api", "core", "crud", "database", "models", "schemas"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
