version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: mpango_postgres
    environment:
      POSTGRES_DB: mpango_erp
      POSTGRES_USER: mpango
      #${POSTGRES_USER:-mpango}
      POSTGRES_PASSWORD: MpangoDBV0.1.2
      #${POSTGRES_PASSWORD}
    env_file:
      - ${SECRETS_DIR:-./secrets}/prod.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mpango -d mpango_erp" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mpango_network

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: mpango_redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mpango_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mpango_backend
    environment:
      # S2-1 COMPLIANCE: All REQUIRED environment variables must be set
      # Environment mode (production/test)
      - MPANGO_ENV=${MPANGO_ENV:-test}
      # Database connection (REQUIRED - app crashes if missing)
      - DATABASE_URL=${DATABASE_URL:-postgresql://mpango:MpangoDBV0.1.2@postgres:5432/mpango_erp}
      - DATABASE_ECHO=${DATABASE_ECHO:-false}
      # Redis connection (REQUIRED - app crashes if missing)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Security settings (REQUIRED - app crashes if using defaults in production)
      - SECRET_KEY=${SECRET_KEY:-MpangoSecretKeyV0.1.2-ChangeInProduction-Min32Chars}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Application settings
      - APP_NAME=${APP_NAME:-Mpango ERP}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # CORS settings
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
      # Multi-tenancy
      - DEFAULT_TENANT_SCHEMA=${DEFAULT_TENANT_SCHEMA:-t_dev}
      # Observability (S2-2, S2-3)
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_REQUEST_LOGGING=${ENABLE_REQUEST_LOGGING:-true}
      # Operational settings
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-30}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-10}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # S2-4: Kubernetes-style health probes
      # Liveness probe - checks if process is alive (/healthz)
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mpango_network
    command: poetry run uvicorn main:app --host 0.0.0.0 --port 8000
    #uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mpango_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mpango_network
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    command: npm run dev

  # Prometheus - Metrics scraping (S2-3)
  prometheus:
    image: prom/prometheus:latest
    container_name: mpango_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - mpango_network
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  prometheus_data:


networks:
  mpango_network:
    driver: bridge
